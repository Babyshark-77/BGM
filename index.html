      function refreshModeConfigDrawer(scrollToBottom = false) {
        if (!activeDrawer || activeDrawer.type !== "mode-config-form") return;
        const currentScroll = drawerBody.scrollTop;
        drawerBody.innerHTML = renderModeConfigDrawerContent(activeDrawer.value, false);
        drawerBody.scrollTop = scrollToBottom ? drawerBody.scrollHeight : currentScroll;
      }

      function getModeConfigEditorKey(kind) {
        return kind === "member" ? "memberEditor" : "tagEditor";
      }

      function getModeConfigCards(kind) {
        return kind === "member" ? modeConfigDraftState.memberCards : modeConfigDraftState.tagCards;
      }

      function openModeConfigEditor(kind, card = null) {
        if (!modeConfigDraftState) {
          resetModeConfigDraftState();
        }

        const editorKey = getModeConfigEditorKey(kind);
        modeConfigDraftState[editorKey] = card
          ? {
              ...cloneModeConfigCard(card),
              originalId: card.id,
              error: "",
            }
          : {
              ...createModeConfigCard(kind),
              originalId: "",
              error: "",
            };

        refreshModeConfigDrawer(true);
      }

      function closeModeConfigEditor(kind) {
        if (!modeConfigDraftState) return;
        modeConfigDraftState[getModeConfigEditorKey(kind)] = null;
        refreshModeConfigDrawer(false);
      }

      function saveModeConfigEditor(kind) {
        if (!modeConfigDraftState) return;
        const editorKey = getModeConfigEditorKey(kind);
        const cardsKey = kind === "member" ? "memberCards" : "tagCards";
        const editor = modeConfigDraftState[editorKey];
        if (!editor) return;

        if (!editor.value.trim()) {
          editor.error = kind === "member" ? "请先填写成员 user_id" : "请先填写 Tag";
          refreshModeConfigDrawer(false);
          return;
        }

        const nextCard = {
          ...editor,
          value: editor.value.trim(),
          error: "",
        };
        delete nextCard.originalId;
        delete nextCard.error;

        if (editor.originalId) {
          modeConfigDraftState[cardsKey] = modeConfigDraftState[cardsKey].map((card) => (card.id === editor.originalId ? nextCard : card));
        } else {
          modeConfigDraftState[cardsKey] = [...modeConfigDraftState[cardsKey], nextCard];
        }

        modeConfigDraftState[editorKey] = null;
        refreshModeConfigDrawer(false);
      }

      function addModeConfigCard(kind) {
        openModeConfigEditor(kind);
      }

      function removeModeConfigCard(kind, cardId) {
        if (!modeConfigDraftState) return;
        const key = kind === "member" ? "memberCards" : "tagCards";
        const editorKey = getModeConfigEditorKey(kind);
        modeConfigDraftState[key] = modeConfigDraftState[key].filter((card) => card.id !== cardId);
        if (modeConfigDraftState[editorKey] && modeConfigDraftState[editorKey].originalId === cardId) {
          modeConfigDraftState[editorKey] = null;
        }
        refreshModeConfigDrawer(false);
      }

      function updateModeConfigCardValue(kind, cardId, value) {
        if (!modeConfigDraftState) return;
        const editor = modeConfigDraftState[getModeConfigEditorKey(kind)];
        if (editor && editor.id === cardId) {
          editor.value = value;
          editor.error = "";
          return;
        }
        const cards = kind === "member" ? modeConfigDraftState.memberCards : modeConfigDraftState.tagCards;
        const card = cards.find((item) => item.id === cardId);
        if (card) {
          card.value = value;
        }
      }

      function updateModeConfigPermission(kind, cardId, permissionKey, choice) {
        if (!modeConfigDraftState) return;
        if (kind === "main") {
          modeConfigDraftState.mainPermissions[permissionKey] = choice;
          return;
        }
        const editor = modeConfigDraftState[getModeConfigEditorKey(kind)];
        if (editor && editor.id === cardId) {
          editor.permissions[permissionKey] = choice;
          return;
        }
        const cards = kind === "member" ? modeConfigDraftState.memberCards : modeConfigDraftState.tagCards;
        const card = cards.find((item) => item.id === cardId);
        if (card) {
          card.permissions[permissionKey] = choice;
        }
      }

      function updateModeConfigMediaSubPermission(kind, cardId, permissionKey, choice) {
        if (!modeConfigDraftState) return;
        if (kind === "main") {
          modeConfigDraftState.mainMediaSubPermissions[permissionKey] = choice;
          return;
        }
        const editor = modeConfigDraftState[getModeConfigEditorKey(kind)];
        if (editor && editor.id === cardId) {
          editor.mediaSubPermissions[permissionKey] = choice;
          return;
        }
        const cards = kind === "member" ? modeConfigDraftState.memberCards : modeConfigDraftState.tagCards;
        const card = cards.find((item) => item.id === cardId);
        if (card) {
          card.mediaSubPermissions[permissionKey] = choice;
        }
      }

      function toggleModeConfigMediaSection(kind, cardId) {
        if (!modeConfigDraftState) return;
        if (kind === "main") {
          modeConfigDraftState.mainMediaExpanded = !modeConfigDraftState.mainMediaExpanded;
          return;
        }
        const editor = modeConfigDraftState[getModeConfigEditorKey(kind)];
        if (editor && editor.id === cardId) {
          editor.mediaExpanded = !editor.mediaExpanded;
          return;
        }
        const cards = kind === "member" ? modeConfigDraftState.memberCards : modeConfigDraftState.tagCards;
        const card = cards.find((item) => item.id === cardId);
        if (card) {
          card.mediaExpanded = !card.mediaExpanded;
        }
      }

      function renderNav() {
        navContainer.innerHTML = navTree
          .map((section) => {
            const isOpen = openGroups.has(section.key);
            const containsCurrent = section.children.some((child) => child.key === currentPage);
            return `
              <section class="nav-section ${isOpen ? "open" : ""} ${containsCurrent ? "active" : ""}" data-nav-group="${section.key}">
                <button class="nav-header" type="button" data-nav-toggle="${section.key}">

                  <span class="nav-arrow">›</span>

                <div class="nav-links">
                  ${section.children
                    .filter((child) => !child.hidden)
                    .map(
                      (child) => `
                        <button class="nav-link ${child.key === currentPage ? "active" : ""}" type="button" data-page="${child.key}">
                          ${child.label}
                        </button>
                      `
                    )
                    .join("")}
                </div>
              </section>
            `;
          })
          .join("");

        navContainer.querySelectorAll("[data-nav-toggle]").forEach((button) => {
          button.addEventListener("click", () => {
            const key = button.dataset.navToggle;
            if (openGroups.has(key)) {
              openGroups.delete(key);
            } else {
              openGroups.add(key);
            }
            renderNav();
            bindNavEvents();
          });
        });

        navContainer.querySelectorAll("[data-page]").forEach((button) => {
          button.addEventListener("click", () => {
            currentPage = button.dataset.page;
            const parent = navTree.find((section) => section.children.some((child) => child.key === currentPage));
            if (parent) {
              openGroups.add(parent.key);
            }
            renderNav();
            bindNavEvents();
            renderPage();
          });
        });
      }

      function bindPageEvents() {
        pageContainer.querySelectorAll("[data-drawer]").forEach((button) => {
          button.addEventListener("click", (event) => {
            event.preventDefault();
            event.stopPropagation();
            openDrawer(button.dataset.drawer, button.dataset.drawerValue || button.textContent.trim());
          });
        });

        pageContainer.querySelectorAll("[data-page-tab]").forEach((button) => {
          button.addEventListener("click", () => {
            closeAllDateFilters();
            const pageKey = button.dataset.pageTab;
            const tabKey = button.dataset.tabKey;
            pageContainer.querySelectorAll(`[data-page-tab="${pageKey}"]`).forEach((tab) => {
              tab.classList.toggle("active", tab === button);
            });
            pageContainer.querySelectorAll(`[data-tab-panel="${pageKey}"]`).forEach((panel) => {
              panel.classList.toggle("active", panel.dataset.tabKey === tabKey);
            });
          });
        });

        const chatRobotSelect = pageContainer.querySelector("[data-chat-robot-select]");
        if (chatRobotSelect) {
          chatRobotSelect.addEventListener("change", () => {
            currentChatRobot = chatRobotSelect.value;
            const robot = getCurrentChatRobotData();
            currentChatGroup = robot.groups[0].key;
            renderPage();
          });
        }

        pageContainer.querySelectorAll("[data-chat-group]").forEach((button) => {
          button.addEventListener("click", () => {
            currentChatGroup = button.dataset.chatGroup;
            renderPage();
          });
        });

        const chatGroupNameInput = pageContainer.querySelector("[data-chat-groupname-input]");
        const chatUsernameInput = pageContainer.querySelector("[data-chat-username-input]");
        const chatUserIdInput = pageContainer.querySelector("[data-chat-userid-input]");
        const chatMessageInput = pageContainer.querySelector("[data-chat-message-input]");
        const chatFilterInputs = [chatGroupNameInput, chatUsernameInput, chatUserIdInput, chatMessageInput].filter(Boolean);

        chatFilterInputs.forEach((inputEl) => {
          inputEl.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
              event.preventDefault();
              currentChatGroupName = chatGroupNameInput ? chatGroupNameInput.value.trim() : "";
              currentChatUsername = chatUsernameInput ? chatUsernameInput.value.trim() : "";
              currentChatUserId = chatUserIdInput ? chatUserIdInput.value.trim() : "";
              currentChatMessage = chatMessageInput ? chatMessageInput.value.trim() : "";
              renderPage();
            }
          });
        });

        const chatSearchButton = pageContainer.querySelector("[data-chat-search]");
        if (chatSearchButton) {
          chatSearchButton.addEventListener("click", () => {
            currentChatGroupName = chatGroupNameInput ? chatGroupNameInput.value.trim() : "";
            currentChatUsername = chatUsernameInput ? chatUsernameInput.value.trim() : "";
            currentChatUserId = chatUserIdInput ? chatUserIdInput.value.trim() : "";
            currentChatMessage = chatMessageInput ? chatMessageInput.value.trim() : "";
            renderPage();
          });
        }

        const chatClearButton = pageContainer.querySelector("[data-chat-clear]");
        if (chatClearButton) {
          chatClearButton.addEventListener("click", () => {
            currentChatGroupName = "";
            currentChatUsername = "";
            currentChatUserId = "";
            currentChatMessage = "";
            renderPage();
          });
        }

        pageContainer.querySelectorAll("[data-date-filter]").forEach((filter) => {
          renderDateFilterControl(filter);
          filter.addEventListener("click", (event) => {
            const filterId = filter.dataset.dateFilter;
            const state = dateFilterStates.get(filterId);
            if (!state) return;

            const presetOption = event.target.closest("[data-date-filter-option]");
            if (presetOption) {
              event.preventDefault();
              const selected = presetOption.dataset.dateFilterOption;
              if (selected === "自定义") {
                closeAllDateFilters(filterId);
                openCustomDateFilter(state);
                renderDateFilterControl(filter);
                return;
              }

              applyPresetToDateFilter(state, selected);
              renderDateFilterControl(filter);
              return;
            }

            const navButton = event.target.closest("[data-date-filter-nav]");
            if (navButton) {
              event.preventDefault();
              const next = addMonths(state.viewYear, state.viewMonth, Number(navButton.dataset.dateFilterNav));
              state.viewYear = next.year;
              state.viewMonth = next.month;
              renderDateFilterControl(filter);
              return;
            }

            const dateButton = event.target.closest("[data-date-filter-date]");
            if (dateButton) {
              event.preventDefault();
              selectDraftDate(state, dateButton.dataset.dateFilterDate);
              renderDateFilterControl(filter);
              return;
            }

            if (event.target.closest("[data-date-filter-cancel]")) {
              event.preventDefault();
              state.customMode = false;
              renderDateFilterControl(filter);
              return;
            }

            if (event.target.closest("[data-date-filter-apply]") && state.draftStart && state.draftEnd) {
              event.preventDefault();
              state.customStart = state.draftStart;
              state.customEnd = state.draftEnd;
              state.value = `${state.customStart} 至 ${state.customEnd}`;
              state.preset = "自定义";
              state.customMode = false;
              renderDateFilterControl(filter);
            }
          });
        });

        if (!dateFilterGlobalBound) {
          dateFilterGlobalBound = true;
        }
      }

              <div class="info-list">
                <div class="info-item"><span>参数名称</span>封禁时长</div>
                <div class="info-item"><span>参数键</span>userBanDuriton</div>
                <div class="info-item"><span>参数值</span>30</div>
                <div class="info-item"><span>参数说明</span>分钟</div>
              </div>
            `
          },
          "account-group": {
            title: "账号分组详情",
            body: `
              <div class="detail-card">
                <h3>分组地址明细</h3>
                <p class="muted" style="margin:0; line-height:1.8;">
                  XdFgNE4, TC5FpKcimfra5JyPckvokuy26dCvScnc8u, TKodKWXzHVFQ9Rr, 2qaVeVrVS3xZ4odXAi8KT18vEQ5VgiW...
                </p>
              </div>
            `
          }
        };

        const config = drawerContent[type] || {
          title: "详情",
          body: `<div class="detail-card"><p class="muted" style="margin:0;">${value || "暂无内容"}</p></div>`,
          footer: { secondary: "关闭" }
        };
        drawerTitle.textContent = config.title;
        drawerBody.innerHTML = typeof config.body === "function" ? config.body() : config.body;
        drawerSecondary.textContent = config.footer?.secondary || "关闭";
        if (config.footer?.primary) {
          drawerPrimary.style.display = "";
          drawerPrimary.textContent = config.footer.primary;
        } else {
          drawerPrimary.style.display = "none";
          drawerPrimary.textContent = "保存配置";
        }
        drawerOverlay.classList.remove("mode-config-drawer", "detail-modal", "history-modal");
        if (config.className) {
          drawerOverlay.classList.add(config.className);
        }
        drawerOverlay.classList.add("open");
      }

      window.__openDemoDrawer = openDrawer;

      function closeDrawer() {
        drawerOverlay.classList.remove("mode-config-drawer", "detail-modal", "history-modal");
        drawerOverlay.classList.remove("open");
        activeDrawer = null;
      }

      drawerClose.addEventListener("click", closeDrawer);
      drawerSecondary.addEventListener("click", closeDrawer);
      drawerPrimary.addEventListener("click", closeDrawer);

      if (!pageDrawerBound) {
        pageDrawerBound = true;
        pageContainer.addEventListener("click", (event) => {
          const button = event.target.closest("[data-drawer]");
          if (!button) return;
          event.preventDefault();
          openDrawer(button.dataset.drawer, button.dataset.drawerValue || button.textContent.trim());
        });
      }

      drawerOverlay.addEventListener("click", (event) => {
        if (event.target === drawerOverlay) {
          closeDrawer();
        }
      });

      drawerBody.addEventListener("click", (event) => {
        const addMemberButton = event.target.closest("[data-mode-config-add-member]");
        if (addMemberButton) {
          event.preventDefault();
          addModeConfigCard("member");
          return;
        }

        const addTagButton = event.target.closest("[data-mode-config-add-tag]");
        if (addTagButton) {
          event.preventDefault();
          addModeConfigCard("tag");
          return;
        }

        const editCardButton = event.target.closest("[data-mode-config-edit-card]");
        if (editCardButton) {
          event.preventDefault();
          const kind = editCardButton.dataset.modeConfigEditCard;
          const cardId = editCardButton.dataset.modeConfigCardId;
          const cards = getModeConfigCards(kind);
          const card = cards.find((item) => item.id === cardId);
          if (card) {
            openModeConfigEditor(kind, card);
          }
          return;
        }

        const removeCardButton = event.target.closest("[data-mode-config-remove-card]");
        if (removeCardButton) {
          event.preventDefault();
          removeModeConfigCard(removeCardButton.dataset.modeConfigRemoveCard, removeCardButton.dataset.modeConfigCardId);
          return;
        }

        const cancelEditorButton = event.target.closest("[data-mode-config-cancel-editor]");
        if (cancelEditorButton) {
          event.preventDefault();
          closeModeConfigEditor(cancelEditorButton.dataset.modeConfigCancelEditor);
          return;
        }

        const saveEditorButton = event.target.closest("[data-mode-config-save-editor]");
        if (saveEditorButton) {
          event.preventDefault();
          saveModeConfigEditor(saveEditorButton.dataset.modeConfigSaveEditor);
          return;
        }

        const mediaToggleButton = event.target.closest("[data-mode-config-toggle-media]");
        if (mediaToggleButton) {
          event.preventDefault();
          toggleModeConfigMediaSection(
            mediaToggleButton.dataset.modeConfigToggleMedia,
            mediaToggleButton.dataset.modeConfigCardId || ""
          );
          refreshModeConfigDrawer(false);
          return;
        }

        const interceptActionButton = event.target.closest("[data-intercept-action]");
        if (interceptActionButton) {
          event.preventDefault();
          modeConfigInterceptAction = interceptActionButton.dataset.interceptAction === "silent" ? "silent" : "notice";
          refreshModeConfigDrawer(false);
          return;
        }

        const permissionChoiceButton = event.target.closest("[data-permission-choice]");
        if (permissionChoiceButton) {
          event.preventDefault();
          const cardId = permissionChoiceButton.dataset.modeConfigCardId;
          const kind = permissionChoiceButton.dataset.modeConfigCardType;
          const scope = permissionChoiceButton.dataset.modeConfigScope;
          const permissionKey = permissionChoiceButton.dataset.modeConfigPermissionKey;
          const mediaSubKey = permissionChoiceButton.dataset.modeConfigMediaSubKey;
          const choice = permissionChoiceButton.dataset.permissionChoice;

          if (scope && mediaSubKey) {
            updateModeConfigMediaSubPermission(scope, permissionChoiceButton.dataset.modeConfigCardId || "", mediaSubKey, choice);
            refreshModeConfigDrawer(false);
            return;
          }

          if (scope && permissionKey) {
            updateModeConfigPermission(scope, permissionChoiceButton.dataset.modeConfigCardId || "", permissionKey, choice);
            refreshModeConfigDrawer(false);
            return;
          }

          if (kind && permissionKey && cardId) {
            updateModeConfigPermission(kind, cardId, permissionKey, choice);
            refreshModeConfigDrawer(false);
            return;
          }
        }
      });

      drawerBody.addEventListener("input", (event) => {
        const memberInput = event.target.closest("[data-mode-config-member-value]");
        if (memberInput) {
          updateModeConfigCardValue("member", memberInput.dataset.modeConfigMemberValue, memberInput.value);
          return;
        }

        const tagInput = event.target.closest("[data-mode-config-tag-value]");
        if (tagInput) {
          updateModeConfigCardValue("tag", tagInput.dataset.modeConfigTagValue, tagInput.value);
        }
      });

      drawerBody.addEventListener("change", (event) => {
        const robotTypeSelect = event.target.closest("[data-robot-form-type]");
        if (robotTypeSelect) {
          robotFormDraftType = robotTypeSelect.value;
          refreshRobotFormDrawer();
        }
      });

      renderNav();
      bindNavEvents();
      renderPage();
    </script>
  </body>
</html>
