<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>机器人群管理</title>
    <style>
      :root {
        --bg: #f4f6fb;
        --panel: #ffffff;
        --panel-2: #fbfcff;
        --line: #e5e9f2;
        --line-dark: #d6dce8;
        --text: #1f2937;
        --muted: #6b7280;
        --blue: #3b82f6;
        --blue-dark: #2d5cf6;
        --blue-soft: #eef4ff;
        --green: #12b981;
        --green-soft: #ecfdf5;
        --orange: #f59e0b;
        --orange-soft: #fff7e8;
        --red: #ef4444;
        --red-soft: #fff1f2;
        --shadow: 0 16px 38px rgba(31, 41, 55, 0.08);
        --radius: 16px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top right, rgba(59, 130, 246, 0.08), transparent 28%),
          linear-gradient(180deg, #f4f6fb 0%, #edf2fb 100%);
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      .app-shell {
        display: grid;
        grid-template-columns: 264px 1fr;
        min-height: 100vh;
      }

      .sidebar {
        position: sticky;
        top: 0;
        height: 100vh;
        padding: 20px 16px 18px;
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(18px);
        border-right: 1px solid rgba(214, 220, 232, 0.88);
        overflow: auto;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 10px 18px;
      }

      .brand-mark {
        width: 44px;
        height: 44px;
        border-radius: 14px;
        background: linear-gradient(135deg, #1c7efb, #5f76ff);
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 22px;
        font-weight: 700;
        box-shadow: 0 12px 28px rgba(59, 130, 246, 0.24);
      }

      .brand-copy h1 {
        margin: 0;
        font-size: 22px;
        line-height: 1.15;
      }

      .brand-copy p {
        margin: 6px 0 0;
        font-size: 12px;
        color: var(--muted);
      }

      .nav-stack {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .nav-section {
        border: 1px solid rgba(214, 220, 232, 0.88);
        border-radius: 18px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.86);
      }

      .nav-section.open {
        box-shadow: 0 12px 26px rgba(31, 41, 55, 0.06);
      }

      .nav-header {
        width: 100%;
        border: 0;
        background: transparent;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 16px;
        cursor: pointer;
        color: inherit;
      }

      .nav-header strong {
        font-size: 15px;
      }

      .nav-header span {
        font-size: 12px;
        color: var(--muted);
      }

      .nav-section.active .nav-header {
        background: linear-gradient(180deg, #f6f9ff 0%, #eef4ff 100%);
        color: var(--blue-dark);
      }

      .nav-arrow {
        transition: transform 0.2s ease;
        color: var(--muted);
      }

      .nav-section.open .nav-arrow {
        transform: rotate(90deg);
      }

      .nav-links {
        display: none;
        padding: 4px 10px 12px;
      }

      .nav-section.open .nav-links {
        display: block;
      }

      .nav-link {
        width: 100%;
        border: 0;
        background: transparent;
        text-align: left;
        padding: 10px 12px;
        border-radius: 12px;
        color: var(--muted);
        cursor: pointer;
        margin-top: 4px;
      }

      .nav-link:hover {
        background: #f7f9fc;
        color: var(--text);
      }

      .nav-link.active {
        background: var(--blue-soft);
        color: var(--blue-dark);
        font-weight: 600;
      }

      .main {
        padding: 18px 22px 28px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        padding: 18px 22px;
        border: 1px solid rgba(214, 220, 232, 0.84);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.82);
        backdrop-filter: blur(18px);
        box-shadow: var(--shadow);
        margin-bottom: 20px;
      }

      .breadcrumb {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .breadcrumb small {
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 11px;
      }

      .breadcrumb strong {
        font-size: 24px;
      }

      .topbar-right {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .icon-chip {
        width: 42px;
        height: 42px;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: #fff;
        display: grid;
        place-items: center;
        color: var(--muted);
      }

      .user-card {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 6px 6px 14px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;
      }

      .avatar {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: linear-gradient(135deg, #cdd9ff, #edf2ff);
        display: grid;
        place-items: center;
        font-weight: 700;
        color: #3757d6;
      }

      .surface {
        border: 1px solid rgba(214, 220, 232, 0.92);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .page {
        display: none;
      }

      .page.active {
        display: block;
      }

      .page-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        padding: 22px 24px 16px;
        border-bottom: 1px solid var(--line);
        background: linear-gradient(180deg, #fbfcff 0%, #f7f9ff 100%);
      }

      .page-title h2 {
        margin: 0;
        font-size: 24px;
      }

      .page-title p {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 13px;
      }

      .page-actions,
      .toolbar-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .btn {
        border: 1px solid var(--line-dark);
        background: #fff;
        color: var(--text);
        border-radius: 12px;
        padding: 10px 16px;
        cursor: pointer;
        transition: 0.16s ease;
      }

      .btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 20px rgba(31, 41, 55, 0.08);
      }

      .btn.primary {
        border-color: var(--blue-dark);
        background: linear-gradient(180deg, #4787ff 0%, #315df6 100%);
        color: #fff;
      }

      .btn.ghost {
        background: #f8fbff;
        color: var(--blue-dark);
      }

      .btn.danger {
        background: var(--red-soft);
        color: var(--red);
        border-color: #fecdd3;
      }

      .page-body {
        padding: 20px 22px 24px;
      }

      .filter-card,
      .table-card,
      .stats-row,
      .detail-card,
      .chat-layout {
        margin-bottom: 18px;
      }

      .filter-card {
        border: 1px solid var(--line);
        border-radius: 20px;
        background: var(--panel-2);
        padding: 18px;
      }

      .grid-4,
      .grid-3,
      .grid-2,
      .grid-5 {
        display: grid;
        gap: 14px;
      }

      .grid-5 {
        grid-template-columns: repeat(5, minmax(0, 1fr));
      }

      .grid-4 {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .grid-3 {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .grid-2 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .field label {
        color: var(--muted);
        font-size: 13px;
      }

      .input,
      .select,
      .textarea {
        width: 100%;
        border: 1px solid var(--line-dark);
        border-radius: 14px;
        background: #fff;
        padding: 11px 13px;
        color: var(--text);
      }

      .textarea {
        min-height: 100px;
        resize: vertical;
      }

      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-top: 16px;
        flex-wrap: wrap;
      }

      .toolbar-note {
        color: var(--muted);
        font-size: 12px;
      }

      .stats-row {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
      }

      .stat-card {
        border: 1px solid var(--line);
        border-radius: 18px;
        background: #fff;
        padding: 16px;
      }

      .stat-card span {
        color: var(--muted);
        font-size: 13px;
      }

      .stat-card strong {
        display: block;
        margin-top: 8px;
        font-size: 28px;
      }

      .tabs {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }

      .tab {
        border: 1px solid var(--line-dark);
        background: #fff;
        border-radius: 999px;
        padding: 9px 14px;
        cursor: pointer;
        color: var(--muted);
      }

      .tab.active {
        background: linear-gradient(180deg, #f7faff 0%, #edf3ff 100%);
        border-color: #b5c9ff;
        color: var(--blue-dark);
        font-weight: 700;
      }

      .tab-panel {
        display: none;
      }

      .tab-panel.active {
        display: block;
      }

      .table-card {
        border: 1px solid var(--line);
        border-radius: 20px;
        background: #fff;
        overflow: hidden;
      }

      .table-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding: 16px 18px;
        border-bottom: 1px solid var(--line);
        background: #fbfcff;
      }

      .table-title {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .table-title strong {
        font-size: 16px;
      }

      .table-wrap {
        overflow: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 920px;
      }

      .table-card.wide-table table {
        min-width: 1180px;
      }

      .table-card.wide-table th,
      .table-card.wide-table td {
        white-space: nowrap;
      }

      th,
      td {
        text-align: left;
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
        font-size: 13px;
        vertical-align: top;
      }

      th {
        background: #f9fbff;
        color: var(--muted);
        font-weight: 600;
        white-space: nowrap;
      }

      tr:hover td {
        background: #fbfdff;
      }

      .cell-stack {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .muted {
        color: var(--muted);
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 999px;
        padding: 5px 10px;
        font-size: 12px;
        border: 1px solid var(--line);
        background: #fff;
        white-space: nowrap;
      }

      .pill.blue {
        color: var(--blue-dark);
        border-color: #c9d8ff;
        background: var(--blue-soft);
      }

      .pill.green {
        color: #0f8b62;
        border-color: #bcebd9;
        background: var(--green-soft);
      }

      .pill.orange {
        color: #b96a00;
        border-color: #ffe1a8;
        background: var(--orange-soft);
      }

      .pill.red {
        color: #c12a3f;
        border-color: #fecdd3;
        background: var(--red-soft);
      }

      .table-checkbox {
        width: 18px;
        height: 18px;
        border: 1px solid #ccd5e7;
        border-radius: 4px;
        display: inline-block;
        background: #fff;
        box-sizing: border-box;
      }

      .switch {
        position: relative;
        width: 46px;
        height: 26px;
        border-radius: 999px;
        background: #d4dbe7;
        display: inline-block;
        vertical-align: middle;
      }

      .switch::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 2px 6px rgba(15, 23, 42, 0.18);
      }

      .switch.on {
        background: linear-gradient(180deg, #62a3ff 0%, #3967f7 100%);
      }

      .switch.on::after {
        left: 23px;
      }

      .pagination {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 14px 18px;
        color: var(--muted);
      }

      .pagination .controls {
        display: flex;
        gap: 8px;
      }

      .inline-tip {
        margin-bottom: 12px;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid #f6d69f;
        background: #fff7e6;
        color: #d97706;
        font-weight: 600;
      }

      .page-btn {
        min-width: 34px;
        height: 34px;
        border-radius: 10px;
        border: 1px solid var(--line-dark);
        background: #fff;
        display: grid;
        place-items: center;
      }

      .page-btn.active {
        border-color: var(--blue-dark);
        background: var(--blue-dark);
        color: #fff;
      }

      .detail-grid {
        display: grid;
        grid-template-columns: 1.5fr 1fr;
        gap: 18px;
      }

      .detail-card {
        border: 1px solid var(--line);
        border-radius: 20px;
        background: #fff;
        padding: 18px;
      }

      .detail-card h3 {
        margin: 0 0 14px;
        font-size: 16px;
      }

      .info-list {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .info-item {
        border: 1px solid var(--line);
        border-radius: 16px;
        background: #fbfcff;
        padding: 12px;
      }

      .info-item span {
        display: block;
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 6px;
      }

      .action-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .table-card.wide-table .action-row {
        flex-wrap: nowrap;
      }

      .tree-id-cell {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        white-space: nowrap;
      }

      .tree-caret {
        width: 14px;
        text-align: center;
        color: var(--muted);
        font-size: 13px;
        line-height: 1;
      }

      .chat-layout {
        display: grid;
        grid-template-columns: 1.4fr 1fr;
        gap: 18px;
      }

      .chat-stream,
      .conversation-panel {
        border: 1px solid var(--line);
        border-radius: 20px;
        background: #fff;
        overflow: hidden;
      }

      .chat-header {
        padding: 16px 18px;
        border-bottom: 1px solid var(--line);
        background: #fbfcff;
      }

      .chat-messages {
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .chat-item {
        display: grid;
        grid-template-columns: 40px 1fr;
        gap: 12px;
      }

      .chat-bubble {
        border: 1px solid var(--line);
        border-radius: 16px;
        background: #fff;
        padding: 12px 14px;
      }

      .chat-bubble p {
        margin: 8px 0 0;
        line-height: 1.7;
      }

      .conversation-grid {
        padding: 18px;
        display: grid;
        gap: 12px;
      }

      .conversation-card {
        border: 1px solid var(--line);
        border-radius: 16px;
        background: #fbfcff;
        padding: 14px;
      }

      .mini-chart {
        display: flex;
        gap: 8px;
        align-items: end;
        height: 110px;
        margin-top: 12px;
      }

      .mini-chart span {
        flex: 1;
        border-radius: 12px 12px 6px 6px;
        background: linear-gradient(180deg, #93c5fd 0%, #315df6 100%);
      }

      .drawer-overlay {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.36);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.22s ease;
      }

      .drawer-overlay.open {
        opacity: 1;
        pointer-events: auto;
      }

      .drawer {
        position: fixed;
        top: 18px;
        right: 18px;
        width: min(480px, calc(100vw - 36px));
        height: calc(100vh - 36px);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.98);
        box-shadow: 0 30px 70px rgba(15, 23, 42, 0.26);
        transform: translateX(110%);
        transition: transform 0.24s ease;
        display: grid;
        grid-template-rows: auto 1fr auto;
        overflow: hidden;
      }

      .drawer-overlay.open .drawer {
        transform: translateX(0);
      }

      .drawer-head,
      .drawer-foot {
        padding: 18px 20px;
        border-bottom: 1px solid var(--line);
        background: #fbfcff;
      }

      .drawer-foot {
        border-bottom: 0;
        border-top: 1px solid var(--line);
        display: flex;
        justify-content: flex-end;
        gap: 10px;
      }

      .drawer-body {
        padding: 18px 20px;
        overflow: auto;
      }

      .drawer-head-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }

      .drawer-close {
        width: 36px;
        height: 36px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: #fff;
        cursor: pointer;
      }

      .hide-mobile {
        display: block;
      }

      @media (max-width: 1320px) {
        .app-shell {
          grid-template-columns: 1fr;
        }

        .sidebar {
          position: static;
          height: auto;
        }

        .stats-row,
        .grid-5,
        .grid-4,
        .grid-3,
        .grid-2,
        .detail-grid,
        .chat-layout,
        .info-list {
          grid-template-columns: 1fr;
        }

        .topbar,
        .page-header,
        .toolbar,
        .pagination {
          flex-direction: column;
          align-items: stretch;
        }

        .hide-mobile {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">M</div>
          <div class="brand-copy">
            <h1>机器人群管理</h1>
          </div>
        </div>
        <div class="nav-stack" id="navStack"></div>
      </aside>

      <main class="main">
        <div class="topbar">
          <div class="breadcrumb">
            <small>管理后台</small>
            <strong id="currentPath">机器人管理 / 机器人列表</strong>
          </div>
          <div class="topbar-right">
            <div class="icon-chip">⌕</div>
            <div class="icon-chip">⚙</div>
            <div class="icon-chip">☾</div>
            <div class="user-card">
              <div class="hide-mobile">
                <div style="font-weight:700;">Admin</div>
              </div>
              <div class="avatar">A</div>
            </div>
          </div>
        </div>

        <div class="surface">
          <div id="pageContainer"></div>
        </div>
      </main>
    </div>

    <div class="drawer-overlay" id="drawerOverlay">
          <aside class="drawer" aria-hidden="true">
        <div class="drawer-head">
          <div class="drawer-head-top">
            <div>
              <h3 id="drawerTitle" style="margin: 6px 0 0; font-size: 22px;">机器人详情</h3>
            </div>
            <button class="drawer-close" id="drawerClose" type="button">✕</button>
          </div>
        </div>
        <div class="drawer-body" id="drawerBody"></div>
        <div class="drawer-foot">
          <button class="btn" type="button" id="drawerSecondary">关闭</button>
        </div>
      </aside>
    </div>

    <script>
      const navTree = [
        {
          key: "robot",
          title: "机器人管理",
          children: [
            { key: "robot-list", label: "机器人列表" },
            { key: "scope-center", label: "群组与频道" }
          ]
        },
        {
          key: "ops",
          title: "运营配置",
          children: [
            { key: "feature-switch", label: "功能开关", hidden: true },
            { key: "command-reply", label: "命令回复" },
            { key: "task-manage", label: "任务列表" },
            { key: "ad-center", label: "广告发布" },
            { key: "risk-center", label: "内容风控" }
          ]
        },
        {
          key: "users",
          title: "用户管理",
          children: [
            { key: "user-list", label: "用户列表", hidden: true },
            { key: "user-balance", label: "用户余额" },
            { key: "user-recharge-records", label: "用户充值记录" }
          ]
        },
        {
          key: "finance",
          title: "财务管理",
          children: [
            { key: "ledger-records", label: "账变记录" },
            { key: "ledger-settings", label: "记账设置" },
            { key: "account-groups", label: "账号分组" }
          ]
        },
        {
          key: "records",
          title: "记录中心",
          children: [
            { key: "chat-message", label: "群聊消息" },
            { key: "listen-record", label: "消息监听记录" }
          ]
        },
        {
          key: "system",
          title: "系统管理",
          children: [
            { key: "params", label: "参数管理" },
            { key: "operation-log", label: "操作历史" }

      function field(label, control) {

      }

      function button(label, type = "", drawerType = "", drawerValue = "") {
        const cls = ["btn", type].filter(Boolean).join(" ");
        const attrs = drawerType ? ` data-drawer="${drawerType}" data-drawer-value="${drawerValue}"` : "";
        return `<button class="${cls}" type="button"${attrs}>${label}</button>`;
      }

      function pill(text, type) {
        return `<span class="pill ${type || ""}">${text}</span>`;
      }

        return `<span class="switch on" aria-hidden="true"></span>`;
      }

        return `<span class="switch" aria-hidden="true"></span>`;
      }

        return `<span class="muted">${text}</span>`;
      }

      function longText(text) {
        return `<div class="cell-stack"><span>${text}</span></div>`;
      }

      function roleSet(tags) {
        return `<div class="cell-stack">${tags.map((tag, index) => pill(tag, index === 0 ? "blue" : "")).join("")}</div>`;
      }

      function avatarCell(letter) {
        return `<div class="avatar" style="width:34px;height:34px;font-size:14px;">${letter}</div>`;
      }

      function actionLinks(labels, drawerTypes = []) {
        return `<div class="action-row">${labels
          .map((label, index) => {
            const drawerType = drawerTypes[index] || "";
            const attrs = drawerType ? ` data-drawer="${drawerType}" data-drawer-value="${label}"` : "";
            return `<button class="btn" type="button"${attrs}>${label}</button>`;
          })
          .join("")}</div>`;
      }

      function treeIdCell(id, options = {}) {
        const level = options.level || 0;
        const hasChildren = !!options.hasChildren;
        const expanded = !!options.expanded;
        const caret = hasChildren ? (expanded ? "⌄" : "›") : "";
        return `<div class="tree-id-cell" style="padding-left:${level * 20}px;"><span class="tree-caret">${caret}</span><span>${id}</span></div>`;
      }

      function stat(label, value) {
        return `<div class="field"><label>${label}</label><div class="input">${value}</div></div>`;
      }

      function statCard(label, value) {
        return `<div class="stat-card"><span>${label}</span><strong>${value}</strong></div>`;
      }

      function tableCheckbox() {
        return `<span class="table-checkbox" aria-hidden="true"></span>`;
      }

      function renderStats(cards) {
        return `<div class="stats-row">${cards.map(([title, value]) => statCard(title, value)).join("")}</div>`;
      }

        return `

      function renderTableCard(title, description, headers, rows, options = {}) {
        const includeCheckbox = options.includeCheckbox !== false;
        const tableClass = options.className ? ` ${options.className}` : "";
        const tableMinWidth = options.minWidth ? ` style="min-width:${options.minWidth}px;"` : "";
        return `
          <div class="table-card${tableClass}">
            <div class="table-wrap">
              <table${tableMinWidth}>
                <thead>
                  <tr>${includeCheckbox ? `<th>${tableCheckbox()}</th>` : ""}${headers.map((head) => `<th>${head}</th>`).join("")}</tr>

                    )
                    .join("")}

            </div>

        return `

      function renderTabs(pageKey, tabs) {
        return `
          <div class="tabs">
            ${tabs.map((tab, index) => `<button class="tab ${index === 0 ? "active" : ""}" type="button" data-page-tab="${pageKey}" data-tab-key="${tab.key}">${tab.label}</button>`).join("")}
          </div>
          ${tabs
            .map(
              (tab, index) => `
                <div class="tab-panel ${index === 0 ? "active" : ""}" data-tab-panel="${pageKey}" data-tab-key="${tab.key}">
                  ${tab.content}
                </div>
              `
            )
            .join("")}
        `;
      }

      function renderNav() {
        navContainer.innerHTML = navTree
          .map((section) => {
            const isOpen = openGroups.has(section.key);
            const containsCurrent = section.children.some((child) => child.key === currentPage);
            return `
              <section class="nav-section ${isOpen ? "open" : ""} ${containsCurrent ? "active" : ""}" data-nav-group="${section.key}">
                <button class="nav-header" type="button" data-nav-toggle="${section.key}">
                  <div>
                    <strong>${section.title}</strong>
                  </div>
                  <span class="nav-arrow">›</span>
                </button>
                <div class="nav-links">
                  ${section.children
                    .filter((child) => !child.hidden)
                    .map(
                      (child) => `
                        <button class="nav-link ${child.key === currentPage ? "active" : ""}" type="button" data-page="${child.key}">
                          ${child.label}
                        </button>
                      `
                    )
                    .join("")}
                </div>
              </section>
            `;
          })
          .join("");

        navContainer.querySelectorAll("[data-nav-toggle]").forEach((button) => {
          button.addEventListener("click", () => {
            const key = button.dataset.navToggle;
            if (openGroups.has(key)) {
              openGroups.delete(key);
            } else {
              openGroups.add(key);
            }
            renderNav();
            bindNavEvents();
          });
        });

        navContainer.querySelectorAll("[data-page]").forEach((button) => {
          button.addEventListener("click", () => {
            currentPage = button.dataset.page;
            const parent = navTree.find((section) => section.children.some((child) => child.key === currentPage));
            if (parent) {
              openGroups.add(parent.key);
            }
            renderNav();
            bindNavEvents();
            renderPage();
          });
        });
      }

              <div class="page-title">
                <h2>${page.title}</h2>
                ${page.subtitle ? `<p>${page.subtitle}</p>` : ""}
              </div>
              ${headerActions ? `<div class="page-actions">${headerActions}</div>` : ""}
            </div>
            <div class="page-body">
              ${tabsHtml}
            </div>
          </section>
        `;

        bindPageEvents();
      }

      function bindPageEvents() {
        pageContainer.querySelectorAll("[data-page-tab]").forEach((button) => {
          button.addEventListener("click", () => {
            const pageKey = button.dataset.pageTab;
            const tabKey = button.dataset.tabKey;
            pageContainer.querySelectorAll(`[data-page-tab="${pageKey}"]`).forEach((tab) => {
              tab.classList.toggle("active", tab === button);
            });
            pageContainer.querySelectorAll(`[data-tab-panel="${pageKey}"]`).forEach((panel) => {
              panel.classList.toggle("active", panel.dataset.tabKey === tabKey);
            });
          });
        });

        pageContainer.querySelectorAll("[data-drawer]").forEach((button) => {
          button.addEventListener("click", () => {
            openDrawer(button.dataset.drawer, button.dataset.drawerValue || button.textContent.trim());
          });
        });
      }
