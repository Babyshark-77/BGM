<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>机器人群管理</title>
    <style>
      :root {
        --bg: #f4f6fb;
        --panel: #ffffff;
        --panel-2: #fbfcff;
        --line: #e5e9f2;
        --line-dark: #d6dce8;
        --text: #1f2937;
        --muted: #6b7280;
        --blue: #3b82f6;
        --blue-dark: #2d5cf6;
        --blue-soft: #eef4ff;
        --green: #12b981;
        --green-soft: #ecfdf5;
        --orange: #f59e0b;
        --orange-soft: #fff7e8;
        --red: #ef4444;
        --red-soft: #fff1f2;
        --shadow: 0 16px 38px rgba(31, 41, 55, 0.08);
        --radius: 16px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top right, rgba(59, 130, 246, 0.08), transparent 28%),
          linear-gradient(180deg, #f4f6fb 0%, #edf2fb 100%);
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      .app-shell {
        display: grid;
        grid-template-columns: 264px 1fr;
        min-height: 100vh;
      }

      .sidebar {
        position: sticky;
        top: 0;
        height: 100vh;
        padding: 20px 16px 18px;
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(18px);
        border-right: 1px solid rgba(214, 220, 232, 0.88);
        overflow: auto;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 10px 18px;
      }

      .brand-mark {
        width: 44px;
        height: 44px;
        border-radius: 14px;
        background: linear-gradient(135deg, #1c7efb, #5f76ff);
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 22px;
        font-weight: 700;
        box-shadow: 0 12px 28px rgba(59, 130, 246, 0.24);
      }

      .brand-copy h1 {
        margin: 0;
        font-size: 22px;
        line-height: 1.15;
      }

      .brand-copy p {
        margin: 6px 0 0;
        font-size: 12px;
        color: var(--muted);
      }

      .nav-stack {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .nav-section {
        border: 1px solid rgba(214, 220, 232, 0.88);
        border-radius: 18px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.86);
      }

      .nav-section.open {
        box-shadow: 0 12px 26px rgba(31, 41, 55, 0.06);
      }

      .nav-header {
        width: 100%;
        border: 0;
        background: transparent;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 16px;
        cursor: pointer;
        color: inherit;
      }

      .nav-header strong {
        font-size: 15px;
      }

      .nav-header span {
        font-size: 12px;
        color: var(--muted);
      }

      .nav-section.active .nav-header {
        background: linear-gradient(180deg, #f6f9ff 0%, #eef4ff 100%);
        color: var(--blue-dark);
      }

      .nav-arrow {
        transition: transform 0.2s ease;
        color: var(--muted);
      }

      .nav-section.open .nav-arrow {
        transform: rotate(90deg);
      }

      .nav-links {
        display: none;
        padding: 4px 10px 12px;
      }

      .nav-section.open .nav-links {
        display: block;
      }

      .nav-link {
        width: 100%;
        border: 0;
        background: transparent;
        text-align: left;
        padding: 10px 12px;
        border-radius: 12px;
        color: var(--muted);
        cursor: pointer;
        margin-top: 4px;
      }

      .nav-link:hover {
        background: #f7f9fc;
        color: var(--text);
      }

      .nav-link.active {
        background: var(--blue-soft);
        color: var(--blue-dark);
        font-weight: 600;
      }

      .main {
        padding: 18px 22px 28px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        padding: 18px 22px;
        border: 1px solid rgba(214, 220, 232, 0.84);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.82);
        backdrop-filter: blur(18px);
        box-shadow: var(--shadow);
        margin-bottom: 20px;
      }

      .breadcrumb {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .breadcrumb small {
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 11px;
      }

      .breadcrumb strong {
        font-size: 24px;
      }

      .topbar-right {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .icon-chip {
        width: 42px;
        height: 42px;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: #fff;
        display: grid;
        place-items: center;
        color: var(--muted);
      }

      .user-card {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 6px 6px 14px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;
      }

      .avatar {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: linear-gradient(135deg, #cdd9ff, #edf2ff);
        display: grid;
        place-items: center;
        font-weight: 700;
        color: #3757d6;
      }

      .surface {
        border: 1px solid rgba(214, 220, 232, 0.92);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .page {
        display: none;
      }

      .page.active {
        display: block;
      }

      .page-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        padding: 22px 24px 16px;
        border-bottom: 1px solid var(--line);
        background: linear-gradient(180deg, #fbfcff 0%, #f7f9ff 100%);
      }

      .page-title h2 {
        margin: 0;
        font-size: 24px;
      }

      .page-title p {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 13px;
      }

      .page-actions,
      .toolbar-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .btn {
        border: 1px solid var(--line-dark);
        background: #fff;
        color: var(--text);
        border-radius: 12px;
        padding: 10px 16px;
        cursor: pointer;
        transition: 0.16s ease;
      }

      .btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 20px rgba(31, 41, 55, 0.08);
      }

      .btn.primary {
        border-color: var(--blue-dark);
        background: linear-gradient(180deg, #4787ff 0%, #315df6 100%);
        color: #fff;
      }

      .btn.ghost {
        background: #f8fbff;
        color: var(--blue-dark);
      }

      .btn.danger {
        background: var(--red-soft);
        color: var(--red);
        border-color: #fecdd3;
      }

      .page-body {
        padding: 20px 22px 24px;
      }

      .filter-card,
      .table-card,
      .stats-row,
      .detail-card,
      .chat-layout {
        margin-bottom: 18px;
      }

      .filter-card {
        border: 1px solid var(--line);
        border-radius: 20px;
        background: var(--panel-2);
        padding: 18px;
      }

      .grid-4,
      .grid-3,
      .grid-2,
      .grid-5 {
        display: grid;
        gap: 14px;
      }

      .grid-5 {
        grid-template-columns: repeat(5, minmax(0, 1fr));
      }

      .grid-4 {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .grid-3 {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .grid-2 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .field.date-row {
        grid-column: 1 / -1;
      }

      .field label {
        color: var(--muted);
        font-size: 13px;
      }

      .input,
      .select,
      .textarea {
        width: 100%;
        border: 1px solid var(--line-dark);
        border-radius: 14px;
        background: #fff;
        padding: 11px 13px;
        color: var(--text);
      }

      .textarea {
        min-height: 100px;
        resize: vertical;
      }

      .date-filter {
        border: 1px solid #d6dce8;
        border-radius: 14px;
        background: linear-gradient(180deg, #ffffff 0%, #fbfcff 100%);
        padding: 14px;
      }

      .date-filter-quick {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
      }

      .date-filter-chip {
        border: 1px solid #d9e2f0;
        border-radius: 10px;
        background: #fff;
        color: #5f6b7c;
        padding: 7px 12px;
        font-size: 12px;
        line-height: 1.4;
        cursor: pointer;
        transition: 0.18s ease;
      }

      .date-filter-chip:hover {
        border-color: #b9c8ea;
        color: var(--blue-dark);
        background: #f8fbff;
      }

      .date-filter-chip.active {
        border-color: #9db8ff;
        background: #edf4ff;
        color: var(--blue-dark);
        font-weight: 600;
      }

      .date-filter-custom {
        margin-top: 14px;
        border-top: 1px solid #edf1f7;
        padding-top: 12px;
      }

      .date-filter-custom-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 10px;
      }

      .date-filter-custom-title {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .date-filter-custom-title strong {
        font-size: 13px;
      }

      .date-filter-custom-title span {
        color: var(--muted);
        font-size: 11px;
      }

      .date-filter-month-nav {
        display: flex;
        gap: 8px;
      }

      .date-filter-month-btn {
        width: 28px;
        height: 28px;
        border: 1px solid #d9e2f0;
        border-radius: 7px;
        background: #fff;
        color: #64748b;
        cursor: pointer;
      }

      .date-filter-calendars {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        max-width: 460px;
      }

      .date-filter-calendar {
        border: 1px solid #edf1f7;
        border-radius: 12px;
        background: #fff;
        padding: 10px;
      }

      .date-filter-calendar-head {
        text-align: center;
        font-weight: 600;
        font-size: 12px;
        margin-bottom: 8px;
      }

      .date-filter-weekdays,
      .date-filter-days {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 4px;
      }

      .date-filter-weekdays span {
        text-align: center;
        color: #94a3b8;
        font-size: 10px;
        padding-bottom: 2px;
      }

      .date-filter-day {
        width: 100%;
        height: 26px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--text);
        cursor: pointer;
        position: relative;
        font-size: 12px;
      }

      .date-filter-day.empty {
        visibility: hidden;
        pointer-events: none;
      }

      .date-filter-day:hover {
        background: #f3f7ff;
      }

      .date-filter-day.in-range {
        background: #eef4ff;
        border-radius: 0;
      }

      .date-filter-day.range-start,
      .date-filter-day.range-end {
        background: linear-gradient(180deg, #4d8dff 0%, #315df6 100%);
        color: #fff;
        border-radius: 8px;
      }

      .date-filter-custom-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 12px;
      }

      .date-filter-action {
        border: 1px solid #d9e2f0;
        border-radius: 8px;
        background: #fff;
        color: #5f6b7c;
        padding: 6px 12px;
        cursor: pointer;
        font-size: 12px;
      }

      .date-filter-action.primary {
        border-color: var(--blue-dark);
        background: linear-gradient(180deg, #4787ff 0%, #315df6 100%);
        color: #fff;
      }

      .date-filter-action[disabled] {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-top: 16px;
        flex-wrap: wrap;
      }

      .toolbar-note {
        color: var(--muted);
        font-size: 12px;
      }

      .stats-row {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
      }

      .stat-card {
        border: 1px solid var(--line);
        border-radius: 18px;
        background: #fff;
        padding: 16px;
      }

      .stat-card span {
        color: var(--muted);
        font-size: 13px;
      }

      .stat-card strong {
        display: block;
        margin-top: 8px;
        font-size: 28px;
      }

      .tabs {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }

      .tab {
        border: 1px solid var(--line-dark);
        background: #fff;
        border-radius: 999px;
        padding: 9px 14px;
        cursor: pointer;
        color: var(--muted);
      }

      .tab.active {
        background: linear-gradient(180deg, #f7faff 0%, #edf3ff 100%);
        border-color: #b5c9ff;
        color: var(--blue-dark);
        font-weight: 700;
      }

      .tab-panel {
        display: none;
      }

      .tab-panel.active {
        display: block;
      }

      .overview-card {
        border: 1px solid var(--line);
        border-radius: 22px;
        background:
          linear-gradient(135deg, rgba(59, 130, 246, 0.08), rgba(18, 185, 129, 0.06)),
          #fff;
        padding: 20px;
        margin-bottom: 18px;
      }

      .overview-card h3 {
        margin: 0 0 8px;
        font-size: 18px;
      }

      .overview-card p {
        margin: 0;
        color: var(--muted);
        line-height: 1.7;
      }

      .category-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
        margin-bottom: 18px;
      }

      .category-card {
        border: 1px solid var(--line);
        border-radius: 20px;
        background: #fff;
        padding: 18px;
      }

      .category-card strong {
        display: block;
        font-size: 16px;
      }

      .category-card p {
        margin: 8px 0 14px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6;
        min-height: 40px;
      }

      .category-meta {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .summary-strip {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }

      .summary-chip {
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;
        padding: 8px 12px;
        color: var(--muted);
        font-size: 13px;
      }

      .summary-chip strong {
        color: var(--text);
        margin-left: 6px;
      }

      .matrix-card {
        border: 1px solid var(--line);
        border-radius: 20px;
        background: #fff;
        padding: 18px;
        margin-bottom: 18px;
      }

      .matrix-card h3 {
        margin: 0 0 8px;
        font-size: 16px;
      }

      .matrix-card p {
        margin: 0 0 16px;
        color: var(--muted);
        line-height: 1.7;
      }

      .table-card {
        border: 1px solid var(--line);
        border-radius: 20px;
        background: #fff;
        overflow: hidden;
      }

      .table-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding: 16px 18px;
        border-bottom: 1px solid var(--line);
        background: #fbfcff;
      }

      .table-title {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .table-title strong {
        font-size: 16px;
      }

      .table-wrap {
        overflow: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 920px;
      }

      .table-card.wide-table table {
        min-width: 1180px;
      }

      .table-card.wide-table th,
      .table-card.wide-table td {
        white-space: nowrap;
      }

      th,
      td {
        text-align: left;
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
        font-size: 13px;
        vertical-align: top;
      }

      th {
        background: #f9fbff;
        color: var(--muted);
        font-weight: 600;
        white-space: nowrap;
      }

      tr:hover td {
        background: #fbfdff;
      }

      .cell-stack {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .muted {
        color: var(--muted);
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 999px;
        padding: 5px 10px;
        font-size: 12px;
        border: 1px solid var(--line);
        background: #fff;
        white-space: nowrap;
      }

      .pill.blue {
        color: var(--blue-dark);
        border-color: #c9d8ff;
        background: var(--blue-soft);
      }

      .pill.green {
        color: #0f8b62;
        border-color: #bcebd9;
        background: var(--green-soft);
      }

      .pill.orange {
        color: #b96a00;
        border-color: #ffe1a8;
        background: var(--orange-soft);
      }

      .pill.red {
        color: #c12a3f;
        border-color: #fecdd3;
        background: var(--red-soft);
      }

      .table-checkbox {
        width: 18px;
        height: 18px;
        border: 1px solid #ccd5e7;
        border-radius: 4px;
        display: inline-block;
        background: #fff;
        box-sizing: border-box;
      }

      .switch {
        position: relative;
        width: 46px;
        height: 26px;
        border-radius: 999px;
        background: #d4dbe7;
        display: inline-block;
        vertical-align: middle;
      }

      .switch::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 2px 6px rgba(15, 23, 42, 0.18);
      }

      .switch.on {
        background: linear-gradient(180deg, #62a3ff 0%, #3967f7 100%);
      }

      .switch.on::after {
        left: 23px;
      }

      .pagination {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 14px 18px;
        color: var(--muted);
      }

      .pagination .controls {
        display: flex;
        gap: 8px;
      }

      .inline-tip {
        margin-bottom: 12px;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid #f6d69f;
        background: #fff7e6;
        color: #d97706;
        font-weight: 600;
      }

      .page-btn {
        min-width: 34px;
        height: 34px;
        border-radius: 10px;
        border: 1px solid var(--line-dark);
        background: #fff;
        display: grid;
        place-items: center;
      }

      .page-btn.active {
        border-color: var(--blue-dark);
        background: var(--blue-dark);
        color: #fff;
      }

      .detail-grid {
        display: grid;
        grid-template-columns: 1.5fr 1fr;
        gap: 18px;
      }

      .detail-card {
        border: 1px solid var(--line);
        border-radius: 20px;
        background: #fff;
        padding: 18px;
      }

      .detail-card h3 {
        margin: 0 0 14px;
        font-size: 16px;
      }

      .info-list {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .info-item {
        border: 1px solid var(--line);
        border-radius: 16px;
        background: #fbfcff;
        padding: 12px;
      }

      .info-item span {
        display: block;
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 6px;
      }

      .action-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .table-card.wide-table .action-row {
        flex-wrap: nowrap;
      }

      .tree-id-cell {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        white-space: nowrap;
      }

      .tree-caret {
        width: 14px;
        text-align: center;
        color: var(--muted);
        font-size: 13px;
        line-height: 1;
      }

      .chat-layout {
        display: grid;
        grid-template-columns: 1.4fr 1fr;
        gap: 18px;
      }

      .chat-workspace-shell {
        display: grid;
        gap: 16px;
      }

      .chat-scene-bar {
        border: 1px solid var(--line);
        border-radius: 22px;
        background: #fff;
        padding: 18px 20px;
        display: grid;
        gap: 18px;
      }

      .chat-scene-meta {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .chat-scene-meta strong {
        font-size: 18px;
      }

      .chat-scene-meta span {
        color: var(--muted);
        font-size: 13px;
      }

      .chat-scene-tags {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .chat-scene-search {
        display: contents;
      }

      .chat-scene-filters {
        display: grid;
        gap: 14px;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: linear-gradient(180deg, #fbfcff 0%, #f7faff 100%);

      function input(placeholder, value) {
        return `<input class="input" type="text" placeholder="${placeholder}" value="${value || ""}" />`;
      }

      function dateFilter(value = "今日") {
        dateFilterCounter += 1;
        const filterId = `date-filter-${dateFilterCounter}`;
        dateFilterStates.set(filterId, createDateFilterState(value));
        return `<div class="date-filter" data-date-filter="${filterId}"></div>`;
      }

      function createDateFilterState(value) {
        const today = new Date();
        return {
          value,
          preset: dateFilterQuickOptions.includes(value) ? value : "自定义",
          open: false,
          customMode: false,
          customStart: null,
          customEnd: null,
          draftStart: null,
          draftEnd: null,
          viewYear: today.getFullYear(),
          viewMonth: today.getMonth()
        };
      }

      function formatDate(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      function addMonths(year, month, delta) {
        const date = new Date(year, month + delta, 1);
        return { year: date.getFullYear(), month: date.getMonth() };
      }

      function getMonthLabel(year, month) {
        return `${year}年${month + 1}月`;
      }

      function getPresetLabel(label) {
        return label === "前天" ? "前日" : label;
      }

      function renderDateFilterControl(filter) {
        const filterId = filter.dataset.dateFilter;
        const state = dateFilterStates.get(filterId);
        if (!state) return;

        filter.innerHTML = `
          <div class="date-filter-quick">
            ${dateFilterQuickOptions
              .map(
                (item) => `
                  <button
                    class="date-filter-chip ${state.preset === item ? "active" : ""}"
                    type="button"
                    data-date-filter-option="${item}"
                  >
                    ${getPresetLabel(item)}
                  </button>
                `
              )
              .join("")}
          </div>
          ${
            state.customMode
              ? `
                <div class="date-filter-custom">
                  ${renderDateFilterCustomPanel(state)}
                </div>
              `
              : ""
          }
        `;
      }

      function renderDateFilterCustomPanel(state) {
        const nextMonth = addMonths(state.viewYear, state.viewMonth, 1);
        return `
          <div class="date-filter-custom-head">
            <div class="date-filter-custom-title">
              <strong>自定义日期区间</strong>
              <span>${state.draftStart && state.draftEnd ? `${state.draftStart} 至 ${state.draftEnd}` : "请选择开始和结束日期"}</span>
            </div>
            <div class="date-filter-month-nav">
              <button class="date-filter-month-btn" type="button" data-date-filter-nav="-1">‹</button>
              <button class="date-filter-month-btn" type="button" data-date-filter-nav="1">›</button>
            </div>
          </div>
          <div class="date-filter-calendars">
            ${renderCalendarMonth(state.viewYear, state.viewMonth, state)}
            ${renderCalendarMonth(nextMonth.year, nextMonth.month, state)}
          </div>
          <div class="date-filter-custom-actions">
            <button class="date-filter-action" type="button" data-date-filter-cancel>取消</button>
            <button class="date-filter-action primary" type="button" data-date-filter-apply ${state.draftStart && state.draftEnd ? "" : "disabled"}>确定</button>
          </div>
        `;
      }

      function renderCalendarMonth(year, month, state) {
        const firstDay = new Date(year, month, 1);
        const firstWeekday = firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1;
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const cells = [];

        for (let index = 0; index < firstWeekday; index += 1) {
          cells.push(`<button class="date-filter-day empty" type="button"></button>`);
        }

        for (let day = 1; day <= daysInMonth; day += 1) {
          const date = new Date(year, month, day);
          const dateValue = formatDate(date);
          const isStart = state.draftStart === dateValue;
          const isEnd = state.draftEnd === dateValue;
          const isInRange = state.draftStart && state.draftEnd && dateValue > state.draftStart && dateValue < state.draftEnd;
          const classes = ["date-filter-day"];
          if (isInRange) classes.push("in-range");
          if (isStart) classes.push("range-start");
          if (isEnd) classes.push("range-end");
          cells.push(
            `<button class="${classes.join(" ")}" type="button" data-date-filter-date="${dateValue}">${day}</button>`
          );
        }

        return `
          <div class="date-filter-calendar">
            <div class="date-filter-calendar-head">${getMonthLabel(year, month)}</div>
            <div class="date-filter-weekdays">${calendarWeekdays.map((item) => `<span>${item}</span>`).join("")}</div>
            <div class="date-filter-days">${cells.join("")}</div>
          </div>
        `;
      }

      function closeAllDateFilters(exceptId = "") {
        document.querySelectorAll("[data-date-filter]").forEach((filter) => {
          const filterId = filter.dataset.dateFilter;
          if (filterId === exceptId) return;
          const state = dateFilterStates.get(filterId);
          if (!state) return;
          if (state.customMode) {
            state.customMode = false;
            renderDateFilterControl(filter);
          }

      }

        const today = new Date();
        const currentMonth = state.customStart ? new Date(state.customStart) : today;
        state.customMode = true;
        state.draftStart = state.customStart;

        state.viewYear = currentMonth.getFullYear();

        if (!state.draftStart || (state.draftStart && state.draftEnd)) {
          state.draftStart = dateValue;
          state.draftEnd = null;
          return;
        }

        if (dateValue < state.draftStart) {
          state.draftEnd = state.draftStart;
          state.draftStart = dateValue;
          return;

        state.draftEnd = dateValue;

      function escapeHtml(text) {
        return String(text)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/\"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function escapeRegExp(text) {
        return text.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      }

      function highlightKeyword(text, keyword) {
        const safeText = escapeHtml(text);
        const trimmedKeyword = keyword.trim();
        if (!trimmedKeyword) return safeText;
        const pattern = new RegExp(`(${escapeRegExp(trimmedKeyword)})`, "ig");
        return safeText.replace(pattern, "<mark>$1</mark>");
      }

              </div>
              <p>${highlightKeyword(message, keyword)}</p>

        const chatFilterInputs = [chatUsernameInput, chatUserIdInput, chatMessageInput].filter(Boolean);

        chatFilterInputs.forEach((inputEl) => {
          inputEl.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
              event.preventDefault();
              currentChatUsername = chatUsernameInput ? chatUsernameInput.value.trim() : "";
              currentChatUserId = chatUserIdInput ? chatUserIdInput.value.trim() : "";
              currentChatMessage = chatMessageInput ? chatMessageInput.value.trim() : "";

          });
        });

        const chatSearchButton = pageContainer.querySelector("[data-chat-search]");
        if (chatSearchButton) {
          chatSearchButton.addEventListener("click", () => {
            currentChatUsername = chatUsernameInput ? chatUsernameInput.value.trim() : "";

            currentChatMessage = chatMessageInput ? chatMessageInput.value.trim() : "";
            renderPage();
          });

        const chatClearButton = pageContainer.querySelector("[data-chat-clear]");
        if (chatClearButton) {
          chatClearButton.addEventListener("click", () => {
            currentChatUsername = "";
            currentChatUserId = "";
            currentChatMessage = "";
            renderPage();
          });
        }

        pageContainer.querySelectorAll("[data-date-filter]").forEach((filter) => {
          renderDateFilterControl(filter);
          filter.addEventListener("click", (event) => {
            const filterId = filter.dataset.dateFilter;
            const state = dateFilterStates.get(filterId);
            if (!state) return;

            const presetOption = event.target.closest("[data-date-filter-option]");
            if (presetOption) {
              event.preventDefault();
              const selected = presetOption.dataset.dateFilterOption;
              if (selected === "自定义") {
                closeAllDateFilters(filterId);
                openCustomDateFilter(state);
                renderDateFilterControl(filter);
                return;
              }

              applyPresetToDateFilter(state, selected);
              renderDateFilterControl(filter);
              return;
            }

            const navButton = event.target.closest("[data-date-filter-nav]");
            if (navButton) {
              event.preventDefault();
              const next = addMonths(state.viewYear, state.viewMonth, Number(navButton.dataset.dateFilterNav));
              state.viewYear = next.year;
              state.viewMonth = next.month;
              renderDateFilterControl(filter);
              return;
            }

            const dateButton = event.target.closest("[data-date-filter-date]");
            if (dateButton) {
              event.preventDefault();
              selectDraftDate(state, dateButton.dataset.dateFilterDate);
              renderDateFilterControl(filter);
              return;
            }

            if (event.target.closest("[data-date-filter-cancel]")) {
              event.preventDefault();
              state.customMode = false;
              renderDateFilterControl(filter);
              return;
            }

            if (event.target.closest("[data-date-filter-apply]") && state.draftStart && state.draftEnd) {
              event.preventDefault();
              state.customStart = state.draftStart;
              state.customEnd = state.draftEnd;
              state.value = `${state.customStart} 至 ${state.customEnd}`;
              state.preset = "自定义";
              state.customMode = false;
              renderDateFilterControl(filter);
            }
          });
        });

        if (!dateFilterGlobalBound) {
          dateFilterGlobalBound = true;
        }
