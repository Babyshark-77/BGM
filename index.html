<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>机器人群管理</title>
    <style>
      :root {
        --bg: #f4f6fb;
        --panel: #ffffff;
        --panel-2: #fbfcff;
        --line: #e5e9f2;
        --line-dark: #d6dce8;
        --text: #1f2937;
        --muted: #6b7280;
        --blue: #3b82f6;
        --blue-dark: #2d5cf6;
        --blue-soft: #eef4ff;
        --green: #12b981;
        --green-soft: #ecfdf5;
        --orange: #f59e0b;
        --orange-soft: #fff7e8;
        --red: #ef4444;
        --red-soft: #fff1f2;
        --shadow: 0 16px 38px rgba(31, 41, 55, 0.08);
        --radius: 16px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top right, rgba(59, 130, 246, 0.08), transparent 28%),
          linear-gradient(180deg, #f4f6fb 0%, #edf2fb 100%);
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      .app-shell {
        display: grid;
        grid-template-columns: 264px 1fr;
        min-height: 100vh;
      }

      .sidebar {
        position: sticky;
        top: 0;
        height: 100vh;
        padding: 20px 16px 18px;
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(18px);
        border-right: 1px solid rgba(214, 220, 232, 0.88);
        overflow: auto;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 10px 18px;
      }

      .brand-mark {
        width: 44px;
        height: 44px;
        border-radius: 14px;
        background: linear-gradient(135deg, #1c7efb, #5f76ff);
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 22px;
        font-weight: 700;
        box-shadow: 0 12px 28px rgba(59, 130, 246, 0.24);
      }

      .brand-copy h1 {
        margin: 0;
        font-size: 22px;
        line-height: 1.15;
      }

      .brand-copy p {
        margin: 6px 0 0;
        font-size: 12px;
        color: var(--muted);
      }

      .nav-stack {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .nav-section {
        border: 1px solid rgba(214, 220, 232, 0.88);
        border-radius: 18px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.86);
      }

      .nav-section.open {
        box-shadow: 0 12px 26px rgba(31, 41, 55, 0.06);
      }

      .nav-header {
        width: 100%;
        border: 0;
        background: transparent;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 16px;
        cursor: pointer;
        color: inherit;
      }

      .nav-header strong {
        font-size: 15px;
      }

      .nav-header span {
        font-size: 12px;
        color: var(--muted);
      }

      .nav-section.active .nav-header {
        background: linear-gradient(180deg, #f6f9ff 0%, #eef4ff 100%);
        color: var(--blue-dark);
      }

      .nav-arrow {
        transition: transform 0.2s ease;
        color: var(--muted);
      }

      .nav-section.open .nav-arrow {
        transform: rotate(90deg);
      }

      .nav-links {
        display: none;
        padding: 4px 10px 12px;
      }

      .nav-section.open .nav-links {
        display: block;
      }

      .nav-link {
        width: 100%;
        border: 0;
        background: transparent;
        text-align: left;
        padding: 10px 12px;
        border-radius: 12px;
        color: var(--muted);
        cursor: pointer;
        margin-top: 4px;
      }

      .nav-link:hover {
        background: #f7f9fc;
        color: var(--text);
      }

      .nav-link.active {
        background: var(--blue-soft);
        color: var(--blue-dark);
        font-weight: 600;
      }

      .main {
        padding: 18px 22px 28px;
        max-width: 1560px;
        width: 100%;
        margin: 0 auto;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        padding: 18px 22px;
        border: 1px solid rgba(214, 220, 232, 0.84);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.82);
        backdrop-filter: blur(18px);
        box-shadow: var(--shadow);
        margin-bottom: 20px;
      }

      .breadcrumb {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .breadcrumb small {
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 11px;
      }

      .breadcrumb strong {
        font-size: 24px;
      }

      .topbar-right {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .icon-chip {
        width: 42px;
        height: 42px;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: #fff;
        display: grid;
        place-items: center;
        color: var(--muted);
      }

      .user-card {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 6px 6px 14px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;
      }

      .avatar {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: linear-gradient(135deg, #cdd9ff, #edf2ff);
        display: grid;
        place-items: center;
        font-weight: 700;
        color: #3757d6;
      }

      .surface {
        border: 1px solid rgba(214, 220, 232, 0.92);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .page {
        display: none;
      }

      .page.active {
        display: block;
      }

      .page-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        padding: 22px 24px 16px;
        border-bottom: 1px solid var(--line);
        background: linear-gradient(180deg, #fbfcff 0%, #f7f9ff 100%);
      }

      .page-title h2 {
        margin: 0;
        font-size: 24px;
      }

      .page-title p {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 13px;
      }

      .page-actions,
      .toolbar-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .btn {
        border: 1px solid var(--line-dark);
        background: #fff;
        color: var(--text);
        border-radius: 12px;
        padding: 10px 16px;
        cursor: pointer;
        transition: 0.16s ease;
      }

      .btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 20px rgba(31, 41, 55, 0.08);
      }

      .btn.primary {
        border-color: var(--blue-dark);
        background: linear-gradient(180deg, #4787ff 0%, #315df6 100%);
        color: #fff;
      }

      .btn.ghost {
        background: #f8fbff;
        color: var(--blue-dark);
      }

      .btn.danger {
        background: var(--red-soft);
        color: var(--red);
        border-color: #fecdd3;
      }

      .page-body {
        padding: 20px 22px 24px;
      }

      .filter-card,
      .table-card,
      .stats-row,
      .detail-card,
      .chat-layout {
        margin-bottom: 18px;
      }

      .filter-card {
        border: 1px solid var(--line);
        border-radius: 20px;
        background: var(--panel-2);
        padding: 18px;
      }

      .grid-4,
      .grid-3,
      .grid-2,
      .grid-5 {
        display: grid;
        gap: 14px;
      }

      .grid-5 {
        grid-template-columns: repeat(5, minmax(0, 1fr));
      }

      .grid-4 {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .grid-3 {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .grid-2 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .field.date-row {
        grid-column: 1 / -1;
      }

      .field label {
        color: var(--muted);
        font-size: 13px;
      }

      .input,
      .select,
      .textarea {
        width: 100%;
        border: 1px solid var(--line-dark);
        border-radius: 14px;
        background: #fff;
        padding: 11px 13px;
        color: var(--text);
      }

      .textarea {
        min-height: 100px;
        resize: vertical;
      }

      .date-filter {
        border: 1px solid #d6dce8;
        border-radius: 14px;
        background: linear-gradient(180deg, #ffffff 0%, #fbfcff 100%);
        padding: 14px;
      }

      .date-filter-quick {
        display: grid;
        grid-template-columns: repeat(4, minmax(120px, 180px));
        gap: 8px;
        max-width: 760px;
      }

      .date-filter-chip {
        border: 1px solid #d9e2f0;
        border-radius: 10px;
        background: #fff;
        color: #5f6b7c;
        padding: 7px 12px;
        font-size: 12px;
        line-height: 1.4;
        cursor: pointer;
        transition: 0.18s ease;
      }

      .date-filter-chip:hover {
        border-color: #b9c8ea;
        color: var(--blue-dark);
        background: #f8fbff;
      }

      .date-filter-chip.active {
        border-color: #9db8ff;
        background: #edf4ff;
        color: var(--blue-dark);
        font-weight: 600;
      }

      .date-filter-custom {
        margin-top: 14px;
        border-top: 1px solid #edf1f7;
        padding-top: 12px;
      }

      .date-filter-custom-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 10px;
      }

      .date-filter-custom-title {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .date-filter-custom-title strong {
        font-size: 13px;
      }

      .date-filter-custom-title span {
        color: var(--muted);
        font-size: 11px;
      }

      .date-filter-month-nav {
        display: flex;
        gap: 8px;
      }

      .date-filter-month-btn {
        width: 28px;
        height: 28px;
        border: 1px solid #d9e2f0;
        border-radius: 7px;
        background: #fff;
        color: #64748b;
        cursor: pointer;
      }

      .date-filter-calendars {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        max-width: 460px;
      }

      .date-filter-calendar {
        border: 1px solid #edf1f7;
        border-radius: 12px;
        background: #fff;
        padding: 10px;
      }

      .date-filter-calendar-head {
        text-align: center;
        font-weight: 600;
        font-size: 12px;
        margin-bottom: 8px;
      }

      .date-filter-weekdays,
      .date-filter-days {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 4px;
      }

      .date-filter-weekdays span {
        text-align: center;
        color: #94a3b8;
        font-size: 10px;
        padding-bottom: 2px;
      }

      .date-filter-day {
        width: 100%;
        height: 26px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--text);
        cursor: pointer;
        position: relative;
        font-size: 12px;
      }

      .date-filter-day.empty {
        visibility: hidden;
        pointer-events: none;
      }

      .date-filter-day:hover {
        background: #f3f7ff;
      }

      .date-filter-day.in-range {
        background: #eef4ff;
        border-radius: 0;
      }

      .date-filter-day.range-start,
      .date-filter-day.range-end {
        background: linear-gradient(180deg, #4d8dff 0%, #315df6 100%);
        color: #fff;
        border-radius: 8px;
      }

      .date-filter-custom-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 12px;
      }

      .date-filter-action {
        border: 1px solid #d9e2f0;
        border-radius: 8px;
        background: #fff;
        color: #5f6b7c;
        padding: 6px 12px;
        cursor: pointer;
        font-size: 12px;
      }

      .date-filter-action.primary {
        border-color: var(--blue-dark);
        background: linear-gradient(180deg, #4787ff 0%, #315df6 100%);
        color: #fff;
      }

      .date-filter-action[disabled] {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-top: 16px;
        flex-wrap: wrap;
      }

      .toolbar-note {
        color: var(--muted);
        font-size: 12px;
      }

      .stats-row {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
      }

      .stat-card {
        border: 1px solid var(--line);
        border-radius: 18px;
        background: #fff;
        padding: 16px;
      }

      .stat-card span {
        color: var(--muted);
        font-size: 13px;
      }

      .stat-card strong {
        display: block;
        margin-top: 8px;
        font-size: 28px;
      }

      .tabs {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }

      .tab {
        border: 1px solid var(--line-dark);
        background: #fff;
        border-radius: 999px;
        padding: 9px 14px;
        cursor: pointer;
        color: var(--muted);
      }

      .tab.active {
        background: linear-gradient(180deg, #f7faff 0%, #edf3ff 100%);
        border-color: #b5c9ff;
        color: var(--blue-dark);
        font-weight: 700;
      }

      .tab-panel {
        display: none;
      }

      .tab-panel.active {
        display: block;
      }

      .overview-card {
        border: 1px solid var(--line);
        border-radius: 22px;
        background:
          linear-gradient(135deg, rgba(59, 130, 246, 0.08), rgba(18, 185, 129, 0.06)),
          #fff;
        padding: 20px;
        margin-bottom: 18px;
      }

      .overview-card h3 {
        margin: 0 0 8px;
        font-size: 18px;
      }

      .overview-card p {
        margin: 0;
        color: var(--muted);
        line-height: 1.7;
      }

      .category-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
        margin-bottom: 18px;
      }

      .category-card {
        border: 1px solid var(--line);
        border-radius: 20px;
        background: #fff;
        padding: 18px;
      }

      .category-card strong {
        display: block;
        font-size: 16px;
      }

      .category-card p {
        margin: 8px 0 14px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6;
        min-height: 40px;
      }

      .category-meta {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .category-stats {
        display: flex;
        gap: 18px;
        flex-wrap: wrap;
        margin-top: 14px;
      }

      .category-stat {
        font-size: 13px;
        font-weight: 600;
      }

      .category-stat.online {
        color: var(--green);
      }

      .category-stat.offline {
        color: var(--red);
      }

      .summary-strip {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }

      .summary-chip {
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;
        padding: 8px 12px;
        color: var(--muted);
        font-size: 13px;
      }

      .summary-chip strong {
        color: var(--text);
        margin-left: 6px;
      }

      .matrix-card {
        border: 1px solid var(--line);
        border-radius: 20px;
        background: #fff;
        padding: 18px;
        margin-bottom: 18px;
      }

      .matrix-card h3 {
        margin: 0 0 8px;
        font-size: 16px;
      }

      .matrix-card p {
        margin: 0 0 16px;
        color: var(--muted);
        line-height: 1.7;
      }

      .inheritance-card {
        border: 1px solid var(--line);
        border-radius: 16px;
        background: #fbfcff;
        padding: 14px;
      }

      .inheritance-card strong {
        display: block;
        margin-bottom: 10px;
      }

      .inheritance-card p {
        margin: 12px 0 0;
        color: var(--muted);
        line-height: 1.7;
        font-size: 13px;
      }

      .type-form-switches {
        display: grid;
        gap: 12px;
      }

      .type-form-switch-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: #fbfcff;
        padding: 12px 14px;
      }

      .history-log-list {
        display: grid;
        gap: 14px;
      }

      .history-log-card {
        border: 1px solid var(--line);
        border-radius: 18px;
        background: #fff;
        padding: 18px;
      }

      .history-log-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
        margin-bottom: 14px;
      }

      .history-log-head strong {
        display: block;
        font-size: 16px;
        margin-bottom: 6px;
      }

      .history-log-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 12px;
        color: var(--muted);
        font-size: 13px;
      }

      .history-log-detail {
        border: 1px solid var(--line);
        border-radius: 14px;
        background: #fbfcff;
        padding: 14px 16px;
        margin-bottom: 14px;
      }

      .history-log-detail strong {
        display: block;
        margin-bottom: 8px;
      }

      .history-log-detail p {
        margin: 0;
        color: var(--muted);
        line-height: 1.8;
      }

      .history-field-list {
        display: grid;
        gap: 10px;
      }

      .history-field-item {
        border: 1px solid var(--line);
        border-radius: 14px;
        background: #fbfcff;
        padding: 14px 16px;
      }

      .history-field-item strong {
        display: block;
        margin-bottom: 10px;
      }

      .history-field-columns {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .history-field-columns div {
        min-width: 0;
      }

      .history-field-columns span {
        display: block;
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 6px;
      }

      .history-field-columns p {
        margin: 0;
        line-height: 1.7;
        word-break: break-word;
      }

      .delete-check-card {
        margin-top: 16px;
        border-radius: 16px;
        padding: 14px 16px;
      }

      .delete-check-card strong {
        display: block;
        margin-bottom: 8px;
      }

      .delete-check-card p {
        margin: 0;
        line-height: 1.8;
      }

      .delete-check-card.success {
        border: 1px solid #a7f3d0;
        background: #ecfdf5;
        color: #0f766e;
      }

      .delete-check-card.blocked {
        border: 1px solid #fecdd3;
        background: #fff1f2;
        color: #b91c1c;
      }

      .table-card {
        border: 1px solid var(--line);
        border-radius: 20px;
        background: #fff;
        overflow: hidden;
      }

      .table-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding: 16px 18px;
        border-bottom: 1px solid var(--line);
        background: #fbfcff;
      }

      .table-title {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .table-title strong {
        font-size: 16px;
      }

      .table-wrap {
        overflow: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 920px;
      }

      .table-card.wide-table table {
        min-width: 1180px;
      }

      .table-card.wide-table th,
      .table-card.wide-table td {
        white-space: nowrap;
      }

      th,
      td {
        text-align: left;
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
        font-size: 13px;
        vertical-align: top;
      }

      th {
        background: #f9fbff;
        color: var(--muted);
        font-weight: 600;
        white-space: nowrap;
      }

      tr:hover td {
        background: #fbfdff;
      }

      .cell-stack {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .muted {
        color: var(--muted);
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 999px;
        padding: 5px 10px;
        font-size: 12px;
        border: 1px solid var(--line);
        background: #fff;
        white-space: nowrap;
      }

      .pill.blue {
        color: var(--blue-dark);
        border-color: #c9d8ff;
        background: var(--blue-soft);
      }

      .pill.green {
        color: #0f8b62;
        border-color: #bcebd9;
        background: var(--green-soft);
      }

      .pill.orange {
        color: #b96a00;
        border-color: #ffe1a8;
        background: var(--orange-soft);
      }

      .pill.red {
        color: #c12a3f;
        border-color: #fecdd3;
        background: var(--red-soft);
      }

      .table-checkbox {
        width: 18px;
        height: 18px;
        border: 1px solid #ccd5e7;
        border-radius: 4px;
        display: inline-block;
        background: #fff;
        box-sizing: border-box;
      }

      .switch {
        position: relative;
        width: 46px;
        height: 26px;
        border-radius: 999px;
        background: #d4dbe7;

      .drawer-overlay {
        position: fixed;
        inset: 0;
        z-index: 1200;
        background: rgba(15, 23, 42, 0.36);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.22s ease;
      }

      .drawer-overlay.open {
        opacity: 1;
        pointer-events: auto;
      }

      .drawer {
        position: fixed;
        top: 18px;
        right: 18px;
        z-index: 1201;
        width: min(480px, calc(100vw - 36px));
        height: calc(100vh - 36px);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.98);
        box-shadow: 0 30px 70px rgba(15, 23, 42, 0.26);
        transform: translateX(110%);
        transition: transform 0.24s ease;
        display: grid;
        grid-template-rows: auto 1fr auto;
        overflow: hidden;
      }

      .drawer-overlay.mode-config-drawer .drawer {
        width: min(760px, calc(100vw - 48px));
      }

      .drawer-overlay.detail-modal {
        background: rgba(15, 23, 42, 0.48);
      }

      .drawer-overlay.detail-modal .drawer {
        top: 50%;
        right: auto;
        left: 50%;
        width: min(980px, calc(100vw - 56px));
        height: min(860px, calc(100vh - 48px));
        border-radius: 28px;
        background: #f8fbff;
        box-shadow: 0 36px 90px rgba(15, 23, 42, 0.32);
        transform: translate(-50%, calc(-50% + 24px)) scale(0.98);
      }

      .drawer-overlay.history-modal {
        background: rgba(15, 23, 42, 0.44);
      }

      .drawer-overlay.history-modal .drawer {
        top: 50%;
        right: auto;
        left: 50%;
        width: min(920px, calc(100vw - 56px));
        height: min(820px, calc(100vh - 48px));
        border-radius: 28px;
        background: #f9fbff;
        box-shadow: 0 36px 90px rgba(15, 23, 42, 0.28);
        transform: translate(-50%, calc(-50% + 24px)) scale(0.98);
      }

      .drawer-overlay.open .drawer {
        transform: translateX(0);
      }

      .drawer-overlay.detail-modal.open .drawer,
      .drawer-overlay.history-modal.open .drawer {
        transform: translate(-50%, -50%) scale(1);
      }

      .drawer-head,
      .drawer-foot {
        padding: 18px 20px;
        border-bottom: 1px solid var(--line);
        background: #fbfcff;
      }

      .drawer-overlay.detail-modal .drawer-head,
      .drawer-overlay.detail-modal .drawer-foot {
        padding: 22px 28px;
        background: rgba(255, 255, 255, 0.92);
      }

      .drawer-overlay.history-modal .drawer-head,

      .drawer-overlay.history-modal .drawer-body {

          linear-gradient(180deg, #f8fbff 0%, #f5f8ff 100%);

        width: 22%;

        width: 12%;

        width: 14%;

        width: 34%;

        width: 8%;

      };

      const navContainer = document.getElementById("navStack");
      const pageContainer = document.getElementById("pageContainer");
      const currentPath = document.getElementById("currentPath");
      const drawerOverlay = document.getElementById("drawerOverlay");
      const drawerBody = document.getElementById("drawerBody");
      const drawerTitle = document.getElementById("drawerTitle");
      const drawerClose = document.getElementById("drawerClose");
      const drawerSecondary = document.getElementById("drawerSecondary");
      const drawerPrimary = document.getElementById("drawerPrimary");

      let currentPage = "robot-list";
      const openGroups = new Set(["robot"]);
      let currentChatRobot = "yun009";
      let currentChatGroup = "group-test";
      let currentChatGroupName = "";
      let currentChatUsername = "";
      let currentChatUserId = "";
      let currentChatMessage = "";

      function input(placeholder, value) {
        return `<input class="input" type="text" placeholder="${placeholder}" value="${value || ""}" />`;
      }

      function dateFilter(value = "今日") {
        dateFilterCounter += 1;
        const filterId = `date-filter-${dateFilterCounter}`;
        dateFilterStates.set(filterId, createDateFilterState(value));
        return `<div class="date-filter" data-date-filter="${filterId}"></div>`;
      }

      function createDateFilterState(value) {
        const today = new Date();
        return {
          value,
          preset: dateFilterQuickOptions.includes(value) ? value : "自定义",
          open: false,
          customMode: false,
          customStart: null,
          customEnd: null,
          draftStart: null,
          draftEnd: null,
          viewYear: today.getFullYear(),
          viewMonth: today.getMonth()
        };
      }

      function formatDate(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      function addMonths(year, month, delta) {
        const date = new Date(year, month + delta, 1);
        return { year: date.getFullYear(), month: date.getMonth() };
      }

      function getMonthLabel(year, month) {
        return `${year}年${month + 1}月`;
      }

      function getPresetLabel(label) {
        return label === "前天" ? "前日" : label;
      }

      function renderDateFilterControl(filter) {
        const filterId = filter.dataset.dateFilter;
        const state = dateFilterStates.get(filterId);
        if (!state) return;

        filter.innerHTML = `
          <div class="date-filter-quick">
            ${dateFilterQuickOptions
              .map(
                (item) => `
                  <button
                    class="date-filter-chip ${state.preset === item ? "active" : ""}"
                    type="button"
                    data-date-filter-option="${item}"
                  >
                    ${getPresetLabel(item)}
                  </button>
                `
              )
              .join("")}
          </div>
          ${
            state.customMode
              ? `
                <div class="date-filter-custom">
                  ${renderDateFilterCustomPanel(state)}
                </div>
              `
              : ""
          }
        `;
      }

      function renderDateFilterCustomPanel(state) {
        const nextMonth = addMonths(state.viewYear, state.viewMonth, 1);
        return `
          <div class="date-filter-custom-head">
            <div class="date-filter-custom-title">
              <strong>自定义日期区间</strong>
              <span>${state.draftStart && state.draftEnd ? `${state.draftStart} 至 ${state.draftEnd}` : "请选择开始和结束日期"}</span>
            </div>
            <div class="date-filter-month-nav">
              <button class="date-filter-month-btn" type="button" data-date-filter-nav="-1">‹</button>
              <button class="date-filter-month-btn" type="button" data-date-filter-nav="1">›</button>
            </div>
          </div>
          <div class="date-filter-calendars">
            ${renderCalendarMonth(state.viewYear, state.viewMonth, state)}
            ${renderCalendarMonth(nextMonth.year, nextMonth.month, state)}
          </div>
          <div class="date-filter-custom-actions">
            <button class="date-filter-action" type="button" data-date-filter-cancel>取消</button>
            <button class="date-filter-action primary" type="button" data-date-filter-apply ${state.draftStart && state.draftEnd ? "" : "disabled"}>确定</button>
          </div>
        `;
      }

      function renderCalendarMonth(year, month, state) {
        const firstDay = new Date(year, month, 1);
        const firstWeekday = firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1;
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const cells = [];

        for (let index = 0; index < firstWeekday; index += 1) {
          cells.push(`<button class="date-filter-day empty" type="button"></button>`);
        }

        for (let day = 1; day <= daysInMonth; day += 1) {
          const date = new Date(year, month, day);
          const dateValue = formatDate(date);
          const isStart = state.draftStart === dateValue;
          const isEnd = state.draftEnd === dateValue;
          const isInRange = state.draftStart && state.draftEnd && dateValue > state.draftStart && dateValue < state.draftEnd;
          const classes = ["date-filter-day"];
          if (isInRange) classes.push("in-range");
          if (isStart) classes.push("range-start");
          if (isEnd) classes.push("range-end");
          cells.push(
            `<button class="${classes.join(" ")}" type="button" data-date-filter-date="${dateValue}">${day}</button>`
          );
        }

        return `
          <div class="date-filter-calendar">
            <div class="date-filter-calendar-head">${getMonthLabel(year, month)}</div>
            <div class="date-filter-weekdays">${calendarWeekdays.map((item) => `<span>${item}</span>`).join("")}</div>
            <div class="date-filter-days">${cells.join("")}</div>
          </div>
        `;
      }

      function closeAllDateFilters(exceptId = "") {
        document.querySelectorAll("[data-date-filter]").forEach((filter) => {
          const filterId = filter.dataset.dateFilter;
          if (filterId === exceptId) return;
          const state = dateFilterStates.get(filterId);
          if (!state) return;
          if (state.customMode) {
            state.customMode = false;
            renderDateFilterControl(filter);
          }
        });
      }

      function openCustomDateFilter(state) {
        const today = new Date();
        const currentMonth = state.customStart ? new Date(state.customStart) : today;
        state.customMode = true;
        state.draftStart = state.customStart;
        state.draftEnd = state.customEnd;
        state.viewYear = currentMonth.getFullYear();
        state.viewMonth = currentMonth.getMonth();
      }

      function applyPresetToDateFilter(state, preset) {
        state.value = preset;
        state.preset = preset;
        state.customMode = false;
      }

      function selectDraftDate(state, dateValue) {
        if (!state.draftStart || (state.draftStart && state.draftEnd)) {
          state.draftStart = dateValue;
          state.draftEnd = null;
          return;
        }

        if (dateValue < state.draftStart) {
          state.draftEnd = state.draftStart;
          state.draftStart = dateValue;
          return;
        }

        state.draftEnd = dateValue;
      }

      function select(options, selectedValue = "") {
        return `<select class="select">${options
          .map((item) => `<option ${item === selectedValue ? "selected" : ""}>${item}</option>`)
          .join("")}</select>`;
      }

      function field(label, control) {
        const isDateField = typeof control === "string" && control.includes('data-date-filter=');
        return `<div class="field ${isDateField ? "date-row" : ""}"><label>${label}</label>${control}</div>`;
      }

      function button(label, type = "", drawerType = "", drawerValue = "") {
        const cls = ["btn", type].filter(Boolean).join(" ");
        const attrs = drawerType ? ` data-drawer="${drawerType}" data-drawer-value="${drawerValue}"` : "";
        return `<button class="${cls}" type="button"${attrs}>${label}</button>`;
      }

      function pill(text, type) {
        return `<span class="pill ${type || ""}">${text}</span>`;
      }

      function onSwitch() {
        return `<span class="switch on" aria-hidden="true"></span>`;
      }

      function offSwitch() {
        return `<span class="switch" aria-hidden="true"></span>`;
      }

      function tokenText(text) {
        return `<span class="muted">${text}</span>`;
      }

      function longText(text) {
        return `<div class="cell-stack"><span>${text}</span></div>`;
      }

      function modeText(text, tone = "") {
        return `<span class="mode-text ${tone}">${text}</span>`;
      }

      function segmentedControl(activeLabel = "", labels = modeConfigPermissionChoices) {
        return `
          <div class="segmented">
            ${labels
              .map((label) => `<button class="${label === activeLabel ? "active" : ""}" type="button">${label}</button>`)
              .join("")}
          </div>
        `;
      }

      const modeConfigPermissionItems = ["发送消息", "发送媒体", "邀请新成员", "置顶消息", "编辑自己的标签", "修改群组信息", "是否修改群名称", "是否修改群简介"];
      const modeConfigPermissionChoices = ["允许", "禁止"];
      const modeConfigMediaSubPermissionItems = ["发送图片", "发送视频", "发送贴纸 & GIF", "发送音乐", "发送文件", "发送语音消息", "发送视频消息", "嵌入链接", "发送投票"];
      let modeConfigDraftState = null;
      let modeConfigDraftSeed = 0;
      let modeConfigInterceptAction = "notice";
      let robotFormDraftType = "";
      let activeDrawer = null;
      let pageDrawerBound = false;

      function createPermissionState(initial = {}) {
        return modeConfigPermissionItems.reduce((acc, item) => {
          acc[item] = initial[item] || "";
          return acc;
        }, {});
      }

      function createMediaSubPermissionState(initial = {}) {
        return modeConfigMediaSubPermissionItems.reduce((acc, item) => {
          acc[item] = initial[item] || "";
          return acc;
        }, {});
      }

      function createModeConfigCard(type, initial = {}) {
        modeConfigDraftSeed += 1;
        return {
          id: initial.id || `${type}-${modeConfigDraftSeed}`,
          title: initial.title || "",
          value: initial.value || "",
          permissions: createPermissionState(initial.permissions),
          mediaExpanded: !!initial.mediaExpanded,
          mediaSubPermissions: createMediaSubPermissionState(initial.mediaSubPermissions),
        };
      }

      function cloneModeConfigCard(card) {
        return createModeConfigCard(card.id.startsWith("member") ? "member" : "tag", {
          id: card.id,
          title: card.title,
          value: card.value,
          permissions: { ...card.permissions },
          mediaExpanded: card.mediaExpanded,
          mediaSubPermissions: { ...card.mediaSubPermissions },
        });
      }

      function resetModeConfigDraftState(record = null) {
        modeConfigDraftSeed = 0;
        modeConfigInterceptAction = record?.interceptAction || "notice";
        modeConfigDraftState = {
          mainPermissions: createPermissionState(
            record?.mainPermissions || {
              "发送消息": "允许",
              "发送媒体": "禁止",
              "邀请新成员": "禁止",
              "置顶消息": "允许",
              "编辑自己的标签": "允许",
              "修改群组信息": "禁止",
              "是否修改群名称": "禁止",
              "是否修改群简介": "禁止",
            }
          ),
          mainMediaExpanded: false,
          mainMediaSubPermissions: createMediaSubPermissionState(record?.mainMediaSubPermissions || {}),
          memberCards: (record?.memberCards || []).map((card) => createModeConfigCard("member", card)),
          memberEditor: null,
          tagCards: (record?.tagCards || []).map((card) => createModeConfigCard("tag", card)),
          tagEditor: null,
        };
      }

      function hasConfiguredMediaSubPermissions(permissions) {
        return Object.values(permissions).some(Boolean);
      }

      function getInterceptActionTip(action = modeConfigInterceptAction) {
        return action === "silent"
          ? "Bot 只删除命中的消息并记录日志，不会在群内发送任何提示。适用于不希望暴露拦截规则或避免影响群内聊天氛围的场景。"
          : "Bot 删除命中的消息后，会在群内发送拦截提示，提醒成员当前群处于该模式且暂无权限发送此类消息。提示会按群、用户、规则进行限频，避免频繁刷屏。";
      }

      function renderReadonlyPermissionSummary(rows, emptyText = "未配置权限") {
        if (!rows.length) {
          return `<div class="muted">${emptyText}</div>`;
        }
        return `
          <div class="config-summary-list">
            ${rows
              .map(
                ([label, state]) => `
                  <div class="config-summary-row">
                    <div class="config-summary-main">
                      <strong>${label}</strong>
                    </div>
                    <div class="config-summary-meta">${pill(state, state === "允许" ? "green" : "red")}</div>
                  </div>
                `
              )
              .join("")}
          </div>
        `;
      }

      function renderReadonlyConfigCards(items, emptyText = "未配置") {
        if (!items.length) {
          return `<div class="muted">${emptyText}</div>`;
        }
        return `
          <div class="config-summary-list">
            ${items
              .map(
                (item) => `
                  <div class="config-summary-row">
                    <div class="config-summary-main">
                      <strong>${item.title}</strong>
                      <span>${item.summary}</span>
                    </div>
                    ${item.meta ? `<div class="config-summary-meta">${item.meta}</div>` : ""}
                  </div>
                `
              )
              .join("")}
          </div>
        `;
      }

      function renderPermissionSegmented(activeLabel, attrs = "") {
        return `
          <div class="segmented">
            ${modeConfigPermissionChoices
              .map(
                (label) => `
                  <button class="${label === activeLabel ? "active" : ""}" type="button" ${attrs} data-permission-choice="${label}">${label}</button>
                `
              )
              .join("")}
          </div>
        `;
      }

      function renderMediaPermissionBlock(state, attrs = {}) {
        const segmentedAttrs = [
          attrs.scope ? `data-mode-config-scope="${attrs.scope}"` : "",
          attrs.cardId ? `data-mode-config-card-id="${attrs.cardId}"` : "",
          `data-mode-config-permission-key="发送媒体"`,
        ]
          .filter(Boolean)
          .join(" ");
        const toggleAttrs = [
          attrs.scope ? `data-mode-config-toggle-media="${attrs.scope}"` : "",
          attrs.cardId ? `data-mode-config-card-id="${attrs.cardId}"` : "",
        ]
          .filter(Boolean)
          .join(" ");
        const subRowAttrs = (permissionKey) =>
          [
            attrs.scope ? `data-mode-config-scope="${attrs.scope}"` : "",
            attrs.cardId ? `data-mode-config-card-id="${attrs.cardId}"` : "",
            `data-mode-config-media-sub-key="${permissionKey}"`,
          ]
            .filter(Boolean)
            .join(" ");

        return `
          <div class="permission-row permission-parent-row">
            <div class="permission-row-left">
              <span>发送媒体</span>
              <small>可展开配置图片、视频、语音、文件等子权限</small>
            </div>
            <div class="permission-row-right">
              ${renderPermissionSegmented(state.permissions["发送媒体"], segmentedAttrs)}
              ${hasConfiguredMediaSubPermissions(state.mediaSubPermissions) ? `<span class="mini-badge">已细分</span>` : ""}
              <button class="expand-toggle" type="button" ${toggleAttrs}>${state.mediaExpanded ? "收起" : "展开"}</button>
            </div>
          </div>
          ${
            state.mediaExpanded
              ? `
                <div class="media-sub-permissions">
                  ${modeConfigMediaSubPermissionItems
                    .map(
                      (item) => `
                        <div class="permission-sub-row">
                          <span>${item}</span>
                          ${renderPermissionSegmented(state.mediaSubPermissions[item], subRowAttrs(item))}
                        </div>
                      `
                    )
                    .join("")}
                </div>
              `
              : ""
          }
        `;
      }

      function renderPermissionListBlock(state, attrs = {}) {
        return `
          <div class="permission-list">
            ${modeConfigPermissionItems
              .map((item) => {
                if (item === "发送媒体") {
                  return renderMediaPermissionBlock(state, attrs);
                }
                const segmentedAttrs = [
                  attrs.scope ? `data-mode-config-scope="${attrs.scope}"` : "",
                  attrs.cardId ? `data-mode-config-card-id="${attrs.cardId}"` : "",
                  `data-mode-config-permission-key="${item}"`,
                ]
                  .filter(Boolean)
                  .join(" ");
                return `
                  <div class="permission-row">
                    <span>${item}</span>
                    ${renderPermissionSegmented(state.permissions[item], segmentedAttrs)}
                  </div>
                `;
              })
              .join("")}
          </div>
        `;
      }

      function getModeConfigPermissionSummary(card) {
        const summaryParts = modeConfigPermissionItems
          .filter((item) => item !== "发送媒体")
          .filter((item) => card.permissions[item])
          .map((item) => `${item}=${card.permissions[item]}`);

        if (card.permissions["发送媒体"]) {
          summaryParts.unshift(`发送媒体=${card.permissions["发送媒体"]}`);
        }

        return summaryParts.length ? summaryParts.join("；") : "未设置特殊权限";
      }

      function getModeConfigMediaSummary(card) {
        const configuredCount = Object.values(card.mediaSubPermissions).filter(Boolean).length;
        return configuredCount ? `媒体已细分 ${configuredCount} 项` : "媒体未细分";
      }

      function renderModeConfigSummaryRow(kind, card, label) {
        return `
          <div class="config-summary-row" data-mode-config-summary-type="${kind}" data-mode-config-card-id="${card.id}">
            <div class="config-summary-main">
              <strong>${escapeHtml(label)}</strong>
              <span>${escapeHtml(getModeConfigPermissionSummary(card))}</span>
            </div>
            <div class="config-summary-meta">
              ${Object.values(card.mediaSubPermissions).some(Boolean) ? `<span class="pill blue">${getModeConfigMediaSummary(card)}</span>` : ""}
              <button class="btn" type="button" data-mode-config-edit-card="${kind}" data-mode-config-card-id="${card.id}">编辑</button>
              <button class="btn danger" type="button" data-mode-config-remove-card="${kind}" data-mode-config-card-id="${card.id}">删除</button>
            </div>
          </div>
        `;
      }

      function renderModeConfigEditorCard(kind, editor) {
        const isMember = kind === "member";
        const title = editor.originalId ? `编辑${isMember ? "成员" : "Tag"}权限` : `新增${isMember ? "成员" : "Tag"}权限`;
        const inputLabel = isMember ? "成员 user_id" : "tag";
        const inputPlaceholder = isMember ? "请输入 Telegram user_id，例如：123456789" : "请输入 tag，例如：客服";
        const inputDataAttr = isMember ? `data-mode-config-member-value="${editor.id}"` : `data-mode-config-tag-value="${editor.id}"`;
        const saveText = editor.originalId ? "保存修改" : `保存该${isMember ? "成员" : "Tag"}权限`;
        const errorHtml = editor.error ? `<div class="field-error">${escapeHtml(editor.error)}</div>` : "";

        return `
          <div class="config-item-card config-editor-card ${isMember ? "member-permission-card" : "tag-permission-card"}" data-mode-config-card-type="${kind}" data-mode-config-card-id="${editor.id}">
            <div class="config-item-head">
              <strong>${title}</strong>
            </div>
            <div class="field">
              <label>${inputLabel}<span class="required">*</span></label>
              <input class="input" type="text" value="${escapeHtml(editor.value)}" placeholder="${inputPlaceholder}" ${inputDataAttr} />
              ${errorHtml}
            </div>
            <div style="margin-top:14px;">
              ${renderPermissionListBlock(editor, { scope: kind, cardId: editor.id })}
            </div>
            <div class="config-item-actions">
              <button class="btn" type="button" data-mode-config-cancel-editor="${kind}">取消</button>
              <button class="btn primary" type="button" data-mode-config-save-editor="${kind}" data-mode-config-card-id="${editor.id}">${saveText}</button>
            </div>
          </div>
        `;
      }

      function roleSet(tags) {
        return `<div class="cell-stack">${tags.map((tag, index) => pill(tag, index === 0 ? "blue" : "")).join("")}</div>`;
      }

      function avatarCell(letter) {
        return `<div class="avatar" style="width:34px;height:34px;font-size:14px;">${letter}</div>`;
      }

      function actionLinks(labels, drawerTypes = [], drawerValues = []) {
        return `<div class="action-row">${labels
          .map((label, index) => {
            const drawerType = drawerTypes[index] || "";
            const drawerValue = drawerValues[index] || label;
            const attrs = drawerType
              ? ` data-drawer="${drawerType}" data-drawer-value="${drawerValue}" onclick="window.__openDemoDrawer && window.__openDemoDrawer(this.dataset.drawer, this.dataset.drawerValue || this.textContent.trim()); return false;"`
              : "";
            return `<button class="btn" type="button"${attrs}>${label}</button>`;
          })
          .join("")}</div>`;
      }

      function treeIdCell(id, options = {}) {
        const level = options.level || 0;
        const hasChildren = !!options.hasChildren;
        const expanded = !!options.expanded;
        const caret = hasChildren ? (expanded ? "⌄" : "›") : "";
        return `<div class="tree-id-cell" style="padding-left:${level * 20}px;"><span class="tree-caret">${caret}</span><span>${id}</span></div>`;
      }

      function stat(label, value) {
        return `<div class="field"><label>${label}</label><div class="input">${value}</div></div>`;
      }

      function statCard(label, value) {
        return `<div class="stat-card"><span>${label}</span><strong>${value}</strong></div>`;
      }

      function tableCheckbox() {
        return `<span class="table-checkbox" aria-hidden="true"></span>`;
      }

      function renderStats(cards) {
        return `<div class="stats-row">${cards.map(([title, value]) => statCard(title, value)).join("")}</div>`;
      }

      function renderFilterCard(fields, actions) {
        const dateFields = fields.filter((item) => item.includes("date-row"));
        const normalFields = fields.filter((item) => !item.includes("date-row"));
        return `
          <div class="filter-card">
            ${normalFields.length ? `<div class="grid-4">${normalFields.join("")}</div>` : ""}
            ${dateFields.length ? `<div style="margin-top:${normalFields.length ? "14px" : "0"};">${dateFields.join("")}</div>` : ""}
            <div class="toolbar">
              <div class="toolbar-actions">${actions.join("")}</div>
            </div>
          </div>
        `;
      }

      function renderTableCard(title, description, headers, rows, options = {}) {
        const includeCheckbox = options.includeCheckbox !== false;
        const tableClass = options.className ? ` ${options.className}` : "";
        const tableMinWidth = options.minWidth ? ` style="min-width:${options.minWidth}px;"` : "";
        return `
          <div class="table-card${tableClass}">
            <div class="table-wrap">
              <table${tableMinWidth}>
                <thead>
                  <tr>${includeCheckbox ? `<th>${tableCheckbox()}</th>` : ""}${headers.map((head) => `<th>${head}</th>`).join("")}</tr>
                </thead>
                <tbody>
                  ${rows
                    .map(
                      (row) => `
                        <tr>
                          ${includeCheckbox ? `<td>${tableCheckbox()}</td>` : ""}${row.map((cell) => `<td>${cell}</td>`).join("")}
                        </tr>
                      `
                    )
                    .join("")}
                </tbody>
              </table>
            </div>
            <div class="pagination">
              <span>共 36 条</span>
              <div class="controls">
                <button class="page-btn">‹</button>
                <button class="page-btn active">1</button>
                <button class="page-btn">2</button>
                <button class="page-btn">3</button>
                <button class="page-btn">›</button>
              </div>
            </div>
          </div>
        `;
      }

      function escapeHtml(text) {
        return String(text)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/\"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function escapeRegExp(text) {
        return text.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      }

      function highlightKeyword(text, keyword) {
        const safeText = escapeHtml(text);
        const trimmedKeyword = keyword.trim();
        if (!trimmedKeyword) return safeText;
        const pattern = new RegExp(`(${escapeRegExp(trimmedKeyword)})`, "ig");
        return safeText.replace(pattern, "<mark>$1</mark>");
      }

      function chatItem(name, username, userId, time, message, keyword = "") {
        return `
          <div class="chat-item">
            <div class="avatar">${name.slice(0, 1)}</div>
            <div class="chat-bubble">
              <div class="cell-stack">
                <strong>${escapeHtml(name)}</strong>
                <span class="muted">@${escapeHtml(username)}　${escapeHtml(userId)}　${escapeHtml(time)}</span>
              </div>
              <p>${highlightKeyword(message, keyword)}</p>
            </div>
          </div>
        `;
      }

      function getCurrentChatRobotData() {
        return chatWorkspaceData.find((item) => item.key === currentChatRobot) || chatWorkspaceData[0];
      }

      function getCurrentChatGroupData() {
        const robot = getCurrentChatRobotData();
        return robot.groups.find((item) => item.key === currentChatGroup) || robot.groups[0];
      }

      function getFilteredChatGroups(robot) {
        const groupNameKeyword = currentChatGroupName.trim().toLowerCase();
        if (!groupNameKeyword) return robot.groups;
        return robot.groups.filter((group) => group.name.toLowerCase().includes(groupNameKeyword));
      }

      function renderChatMemberCard(member) {
        return `
          <div class="chat-member-card">
            <strong>${member.name}</strong>
            <span>@${member.username}</span>
            <div class="chat-member-card-row">
              ${pill(member.role, member.role.includes("管理") || member.role === "群主" ? "blue" : "")}
            </div>
          </div>
        `;
      }

      function getChatPreview() {
        return "群简介占位";
      }

      function getFilteredChatMessages(group) {
        if (!group) return [];
        const usernameKeyword = currentChatUsername.trim().toLowerCase();
        const userIdKeyword = currentChatUserId.trim().toLowerCase();
        const messageKeyword = currentChatMessage.trim().toLowerCase();
        return group.messages.filter(([name, username, userId, time, message]) => {
          const matchesUsername =
            !usernameKeyword || [name, username].some((item) => String(item).toLowerCase().includes(usernameKeyword));
          const matchesUserId = !userIdKeyword || String(userId).toLowerCase().includes(userIdKeyword);
          const matchesMessage =
            !messageKeyword || String(message).toLowerCase().includes(messageKeyword);
          return matchesUsername && matchesUserId && matchesMessage;
        });
      }

      function renderChatWorkspace() {
        const robot = getCurrentChatRobotData();
        const filteredGroups = getFilteredChatGroups(robot);
        const group =
          filteredGroups.find((item) => item.key === currentChatGroup) ||
          filteredGroups[0] ||
          null;
        const filteredMessages = getFilteredChatMessages(group);
        const hasFilter =
          currentChatGroupName.trim() ||
          currentChatUsername.trim() ||
          currentChatUserId.trim() ||
          currentChatMessage.trim();
        return `
          <div class="chat-workspace-shell">
            <div class="chat-scene-bar">
              <div class="chat-scene-meta">
                <strong>会话总览</strong>
                <span>当前机器人：${robot.name}</span>
                <div class="chat-scene-tags">
                  ${pill(robot.type, "blue")}
                  ${pill(`${robot.groups.length} 个群组`, "green")}
                  ${hasFilter ? pill("已筛选", "orange") : pill("全部消息", "blue")}

              </div>

                <div class="chat-scene-filter-row chat-scene-filter-row--top">

                    <label>机器人</label>
                    <select class="select" data-chat-robot-select>
                      ${chatWorkspaceData
                        .map(
                          (item) => `
                            <option value="${item.key}" ${item.key === robot.key ? "selected" : ""}>${item.name}</option>
                          `
                        )
                        .join("")}
                    </select>
                  </div>
                  <div class="chat-scene-filter">
                    <label>群名称</label>
                    <input class="input chat-inline-search" type="text" value="${escapeHtml(currentChatGroupName)}" placeholder="搜索群名称" data-chat-groupname-input />
                  </div>
                </div>
                <div class="chat-scene-filter-row chat-scene-filter-row--middle">
                  <div class="chat-scene-filter">
                    <label>消息</label>
                    <input class="input chat-inline-search" type="text" value="${escapeHtml(currentChatMessage)}" placeholder="关键词搜索群消息" data-chat-message-input />
                  </div>
                  <div class="chat-scene-filter">
                    <label>用户名</label>
                    <input class="input chat-inline-search" type="text" value="${escapeHtml(currentChatUsername)}" placeholder="请输入用户名" data-chat-username-input />
                  </div>
                  <div class="chat-scene-filter">
                    <label>用户ID</label>
                    <input class="input chat-inline-search" type="text" value="${escapeHtml(currentChatUserId)}" placeholder="请输入用户ID" data-chat-userid-input />
                  </div>
                  <div class="chat-scene-actions">
                    <button class="btn primary" type="button" data-chat-search>搜索</button>
                    <button class="btn" type="button" data-chat-clear>清空</button>
                  </div>
                </div>
                <div class="chat-scene-filter-row chat-scene-filter-row--bottom">
                  <div class="chat-scene-filter chat-scene-filter--time">
                    <label>时间</label>
                    ${dateFilter()}
                  </div>
                </div>
              </div>
            </div>
            <div class="chat-workspace">
              <div class="chat-groups">
                <div class="chat-groups-head">
                  <strong>群组</strong>
                  <span>${filteredGroups.length} 个</span>
                </div>
                <div class="chat-groups-list">
                  ${
                    filteredGroups.length
                      ? filteredGroups
                    .map(
                      (item) => `
                        <button class="chat-group-card ${item.key === group.key ? "active" : ""}" type="button" data-chat-group="${item.key}">
                          <strong>${item.name}</strong>
                          <span>群成员 ${item.memberCount} 人</span>
                          <span>${item.rightsSummary}</span>
                          <span class="chat-group-preview">${escapeHtml(getChatPreview(item))}</span>
                        </button>
                      `
                    )
                    .join("")
                      : `<div class="chat-empty-state">暂无匹配群组</div>`
                  }
                </div>
              </div>
              <div class="chat-main">
                <div class="chat-main-head">
                  <div class="chat-main-meta">
                    <strong>${group ? group.name : "暂无群组"}</strong>
                    <p>${robot.name}</p>
                    <p>${group ? `群成员 ${group.memberCount} 人` : "请先选择匹配群组"}</p>
                  </div>
                  <div class="chat-main-toolbar">
                    ${group ? pill(group.rightsSummary, "green") : pill("无群组", "orange")}
                    <button class="btn" type="button" data-drawer="group-name-record" data-drawer-value="${group ? group.name : ""}">查看群名记录</button>
                  </div>
                </div>
                <div class="chat-main-body">
                  <div class="chat-thread">
                    <div class="chat-thread-top">
                      <div class="chat-thread-title">
                        <strong>群消息</strong>
                        <span>${group ? `${filteredMessages.length} 条` : "0 条"}</span>
                      </div>
                    </div>
                    <div class="chat-messages">
                      ${
                        group && filteredMessages.length
                          ? filteredMessages.map((message) => chatItem(...message, currentChatMessage)).join("")
                          : `<div class="chat-empty-state">${group ? "暂无匹配消息" : "暂无群组可显示"}</div>`
                      }
                    </div>
                  </div>
                  <div class="chat-member-panel">
                    <div class="chat-member-section-title">群成员列表<span>${group ? `${group.members.length} 位群成员` : "0 位群成员"}</span></div>
                    <div class="chat-member-list">
                      ${group ? group.members.map((member) => renderChatMemberCard(member)).join("") : `<div class="chat-empty-state">暂无群成员</div>`}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      function renderTabs(pageKey, tabs) {
        return `
          <div class="tabs">
            ${tabs.map((tab, index) => `<button class="tab ${index === 0 ? "active" : ""}" type="button" data-page-tab="${pageKey}" data-tab-key="${tab.key}">${tab.label}</button>`).join("")}
          </div>
          ${tabs
            .map(
              (tab, index) => `
                <div class="tab-panel ${index === 0 ? "active" : ""}" data-tab-panel="${pageKey}" data-tab-key="${tab.key}">
                  ${tab.content}
                </div>
              `
            )
            .join("")}
        `;
      }

      function getRobotTypeByKey(typeKey) {
        return robotTypeDirectory.find((item) => item.key === typeKey) || null;
      }

      function getRobotTypeByLabel(typeLabel) {
        return robotTypeDirectory.find((item) => item.label === typeLabel) || null;
      }

      function getRobotByName(name) {
        return robotDirectory.find((item) => item.name === name) || null;
      }

      function getRobotsByCategory(categoryKey) {
        if (categoryKey === "all") return robotDirectory;
        return robotDirectory.filter((robot) => robot.type === categoryKey);
      }

      function getTypeStatusSummary(typeKey) {
        const robots = getRobotsByCategory(typeKey);
        return {
          total: robots.length,
          online: robots.filter((robot) => robot.status === "online").length,
          offline: robots.filter((robot) => robot.status !== "online").length
        };
      }

      function getTypeFeatureSummary(typeKey) {
        const type = getRobotTypeByKey(typeKey);
        return type ? type.features : { ledger: false, message: false, mass: false, ad: false };
      }

      function getTypeModeConfigRecord(value) {
        return typeModeConfigRecords.find((item) => item.key === value || item.modeName === value) || null;
      }

      function getTypeCommandReplyRecord(value) {
        return typeCommandReplyRecords.find((item) => item.key === value || item.title === value) || null;
      }

      function getModeSummaryByType(typeKey) {
        const rows = typeModeConfigRecords.filter((item) => item.type === typeKey).map((item) => item.modeName);
        return rows.length ? rows.join(" / ") : "未配置模式";
      }

      function robotTypeSelect(selectedLabel = "全部机器人") {
        return select(robotCategories.map((item) => item.label), selectedLabel);
      }

      function robotTypeOnlySelect(selectedLabel = "") {
        return select(robotTypeDirectory.map((item) => item.label), selectedLabel);
      }

      function robotTypePill(text) {
        return pill(text, "blue");
      }

      function robotStatusPill(status) {
        return status === "online" ? pill("在线", "green") : pill("离线");
      }

      function renderTypeFeaturePills(features) {
        const featureMap = [
          ["ledger", "记账功能"],
          ["message", "消息管理"],
          ["mass", "群发消息"],
          ["ad", "自动广告发布"]
        ];
        return `<div class="cell-stack">${featureMap
          .map(([key, label]) => pill(label, features[key] ? "green" : ""))
          .join("")}</div>`;
      }

      function renderTypeInheritanceHint(typeKey) {
        const type = getRobotTypeByKey(typeKey);
        if (!type) {
          return `<div class="muted">请先选择机器人类型，机器人创建后将自动继承该类型下配置的功能、模式配置与命令回复。</div>`;
        }
        return `
          <div class="inheritance-card">
            <strong>${type.label} 已配置能力</strong>
            <div class="inheritance-pills">${renderTypeFeaturePills(type.features)}</div>
          </div>
        `;
      }

      function getCommandReplySummaryByType(typeKey) {
        const rows = typeCommandReplyRecords.filter((item) => item.type === typeKey);
        if (!rows.length) return "当前类型下暂未配置命令回复";
        return `已配置 ${rows.length} 条：${rows.map((item) => item.title).join(" / ")}`;
      }

      function getRobotFormSelectedType(modeLabel) {
        const isCreate = modeLabel === "新增机器人";
        if (robotFormDraftType) return getRobotTypeByKey(robotFormDraftType);
        const robot = getRobotByName(modeLabel) || robotDirectory[0];
        if (isCreate) return null;
        return robot ? getRobotTypeByKey(robot.type) : null;
      }

      function resetRobotFormDraftType(modeLabel) {
        const robot = getRobotByName(modeLabel) || robotDirectory[0];
        robotFormDraftType = modeLabel === "新增机器人" ? "" : robot?.type || "";
      }

      function refreshRobotFormDrawer() {
        if (!activeDrawer || activeDrawer.type !== "robot-form") return;
        drawerBody.innerHTML = robotFormContent(activeDrawer.value);
      }

      function renderChangeHistoryTable(records, title = "修改记录", view = "detail") {
        if (!records.length) {
          return `
            <div class="detail-card">
              <h3>${title}</h3>
              <p class="muted" style="margin:0;">暂无记录</p>
            </div>
          `;
        }

        if (view === "lifecycle") {
          return `
            <div class="detail-card">
              <h3>${title}</h3>
              <div class="history-table-wrap">
                <table class="history-table history-table--lifecycle">
                  <thead>
                    <tr><th>时间</th><th>操作人</th><th>动作</th><th>对象</th><th>说明</th></tr>
                  </thead>
                  <tbody>
                    ${records
                      .map(
                        (item) => `
                          <tr>
                            <td>${item.time || "—"}</td>
                            <td>${item.operator || "—"}</td>
                            <td>${item.action || "—"}</td>
                            <td>${item.target || "—"}</td>
                            <td>${item.details || "—"}</td>
                          </tr>
                        `
                      )
                      .join("")}
                  </tbody>
                </table>
              </div>
            </div>
          `;
        }

        if (view === "table") {
          const rows = records.flatMap((item) => {
            const fieldChanges = item.fieldChanges?.length
              ? item.fieldChanges
              : [{ field: "变更内容", before: "—", after: item.details || "—" }];
            return fieldChanges.map((field, index) => ({
              time: item.time || "—",
              operator: item.operator || "—",
              action: item.action || "—",
              field: field.field || "—",
              before: field.before || "—",
              after: field.after || "—",
              details: item.details || "—"
            }));
          });

          return `
            <div class="detail-card">
              <h3>${title}</h3>
              <div class="history-table-wrap">
                <table class="history-table history-table--change">
                  <thead>
                    <tr><th>时间</th><th>操作人</th><th>动作</th><th>字段</th><th>修改前</th><th>修改后</th><th>说明</th></tr>
                  </thead>
                  <tbody>
                    ${rows
                      .map(
                        (item) => `
                          <tr>
                            <td>${item.time}</td>
                            <td>${item.operator}</td>
                            <td>${item.action}</td>
                            <td>${item.field}</td>
                            <td>${item.before}</td>
                            <td>${item.after}</td>
                            <td>${item.details}</td>
                          </tr>
                        `
                      )
                      .join("")}
                  </tbody>
                </table>
              </div>
            </div>
          `;
        }

        if (Array.isArray(records[0])) {
          return `
            <div class="detail-card">
              <h3>${title}</h3>
              <table>
                <thead>
                  <tr><th>时间</th><th>操作人</th><th>动作</th><th>修改内容</th></tr>
                </thead>
                <tbody>
                  ${records
                    .map(
                      (item) => `
                        <tr>
                          <td>${item[0]}</td>
                          <td>${item[1]}</td>
                          <td>${item[2]}</td>
                          <td>${item[3]}</td>
                        </tr>
                      `
                    )
                    .join("")}
                </tbody>
              </table>
            </div>
          `;
        }

        return `
          <div class="detail-card">
            <h3>${title}</h3>
            <div class="history-log-list">
              ${records
                .map(
                  (item) => `
                    <div class="history-log-card">
                      <div class="history-log-head">
                        <div>
                          <strong>${item.action}${item.target ? ` · ${item.target}` : ""}</strong>
                          <div class="history-log-meta">
                            <span>时间：${item.time || "—"}</span>
                            <span>操作人：${item.operator || "—"}</span>
                          </div>
                        </div>
                        ${pill(item.action || "记录", item.action?.includes("删除") ? "red" : item.action?.includes("新增") ? "green" : "blue")}
                      </div>
                      ${
                        item.details
                          ? `
                            <div class="history-log-detail">
                              <strong>变更说明</strong>
                              <p>${item.details}</p>
                            </div>
                          `
                          : ""
                      }
                      ${
                        item.fieldChanges?.length
                          ? `
                            <div class="history-field-list">
                              ${item.fieldChanges
                                .map(
                                  (field) => `
                                    <div class="history-field-item">
                                      <strong>${field.field}</strong>
                                      <div class="history-field-columns">
                                        <div>
                                          <span>修改前</span>
                                          <p>${field.before || "—"}</p>
                                        </div>
                                        <div>
                                          <span>修改后</span>
                                          <p>${field.after || "—"}</p>
                                        </div>
                                      </div>
                                    </div>
                                  `
                                )
                                .join("")}
                            </div>
                          `
                          : ""
                      }
                    </div>
                  `
                )
                .join("")}
            </div>
          </div>
        `;
      }

      function renderRobotTypeManageTab() {
        const rows = robotTypeDirectory.map((type) => {
          const status = getTypeStatusSummary(type.key);
          const robots = getRobotsByCategory(type.key);
          return [
            `<div class="cell-stack"><strong>${type.label}</strong><span class="muted">标识：${type.code}</span></div>`,
            renderTypeFeaturePills(type.features),
            `${robots.length} 台`,
            `<div class="cell-stack"><strong>${status.online} 台在线</strong><span class="muted">${status.offline} 台离线</span></div>`,
            `${type.modeCount} 条`,
            `${type.commandCount} 条`,
            `<div class="cell-stack"><strong>${type.updatedAt}</strong><span class="muted">${type.owner}</span></div>`,
            actionLinks(
              ["查看详情", "编辑类型", "删除类型", "修改记录"],

            </div>
          </div>
          ${renderTableCard("", "", ["类型名称", "功能配置", "关联机器人", "在线/离线", "模式配置", "命令回复", "最近修改", "操作"], rows, {
            className: "wide-table",
            minWidth: 1440,
            includeCheckbox: false
          })}
        `;
      }

      function renderTypeModeConfigTab() {
        const rows = typeModeConfigRecords.map((record) => [
          robotTypePill(record.typeLabel),
          `<div class="cell-stack"><strong>${record.modeName}</strong><span class="muted">${record.description}</span></div>`,
          record.trigger,
          `<div class="cell-stack"><strong>${record.relatedRobotNames.length} 台</strong><span class="muted">${record.relatedRobotNames.join(" / ")}</span></div>`,
          `user_id ${record.whitelistUserIds.length} 个 / tag ${record.whitelistTags.length} 个`,
          `<div class="cell-stack"><span>默认权限 ${Object.values(record.mainPermissions).filter(Boolean).length} 项</span><span class="muted">成员 ${record.memberCards.length} 条 / Tag ${record.tagCards.length} 条</span></div>`,
          `<div class="cell-stack"><strong>${record.interceptTypes.join("、") || "未配置"}</strong><span class="muted">${record.interceptAction === "silent" ? "静默删除" : "删除并提示"}</span></div>`,
          record.status === "启用" ? pill("启用", "green") : pill("停用", "red"),
          record.updatedAt,
          actionLinks(
            ["查看", "编辑", record.status === "启用" ? "停用" : "启用", "删除", "修改记录"],
            ["mode-config-detail", "mode-config-form", "", "", "type-mode-row-history"],
            [record.key, record.key, record.key, record.key, record.key]
          )
        ]);

        return `
          ${renderFilterCard([
            field("机器人类型", robotTypeSelect()),
            field("模式名称", input("请输入模式名称", "锁群")),
            field("触发指令", input("请输入触发指令", "123321")),
            field("启用状态", select(["全部状态", "启用", "停用"], "全部状态"))
          ], [
            button("查询", "primary"),
            button("重置"),
            button("记录", "ghost", "type-mode-history", "模式配置记录"),
            button("新增模式", "ghost", "mode-config-form", "新增模式")
          ])}
          ${renderTableCard("", "", ["机器人类型", "模式名称", "触发指令", "关联机器人", "白名单", "配置摘要", "消息拦截", "启用状态", "最近更新时间", "操作"], rows, {
            className: "wide-table",
            minWidth: 1680
          })}
        `;
      }

      function renderTypeCommandReplyTab() {
        const rows = typeCommandReplyRecords.map((record) => [
          robotTypePill(record.typeLabel),
          `<div class="cell-stack"><strong>${record.title}</strong><span class="muted">${record.replyType}</span></div>`,

          record.binding,

          `<div class="cell-stack"><strong>${record.relatedRobotNames.length} 台</strong><span class="muted">${record.relatedRobotNames.join(" / ")}</span></div>`,
          record.updatedAt,
          actionLinks(["查看", "编辑", "删除", "修改记录"], ["command", "command-form", "", "type-command-row-history"], [record.key, record.key, record.key, record.key])
        ]);

        return `
          ${renderFilterCard([
            field("机器人类型", robotTypeSelect()),
            field("标题", input("请输入标题", "开始")),
            field("绑定值", input("请输入绑定值", "/start")),
            field("回复类型", select(["全部类型", "命令/按钮", "模式引导"], "全部类型"))
          ], [button("查询", "primary"), button("重置")])}
          <div class="toolbar" style="margin-top:0;">
            <div class="toolbar-actions">
              ${button("新增", "primary", "command-form", "新增命令回复")}
              ${button("删除", "ghost")}
              ${button("记录", "ghost", "type-command-history", "命令回复记录")}
            </div>
          </div>
          ${renderTableCard("", "", ["机器人类型", "标题", "回复类型", "绑定值", "回复内容 / 按钮", "关联机器人", "最近更新时间", "操作"], rows, {
            className: "wide-table",
            minWidth: 1380
          })}
        `;
      }

          <div class="field">

        const typeSelect = `
          <select class="select">
            <option value="" ${isCreate ? "selected" : ""}>请选择机器人类型</option>
            ${robotTypeDirectory
              .map(
                (item) => `
                  <option ${!isCreate && item.key === record.type ? "selected" : ""}>${item.label}</option>
                `
              )
              .join("")}
          </select>
        `;
        const whitelistUserIds = isCreate ? "" : record.whitelistUserIds.join(",\n");
        const whitelistTags = isCreate ? "" : record.whitelistTags.join(",\n");

          ? []
          : Object.entries(record.mainPermissions)
              .filter(([, state]) => state)
              .map(([label, state]) => [label, state]);
        const memberRows = isCreate
          ? []
          : record.memberCards.map((card) => ({
              title: card.value,
              summary: getModeConfigPermissionSummary(card),
              meta: Object.values(card.mediaSubPermissions || {}).some(Boolean) ? pill(getModeConfigMediaSummary(card), "blue") : ""
            }));
        const tagRows = isCreate
          ? []
          : record.tagCards.map((card) => ({
              title: card.value,
              summary: getModeConfigPermissionSummary(card),
              meta: Object.values(card.mediaSubPermissions || {}).some(Boolean) ? pill(getModeConfigMediaSummary(card), "blue") : ""
            }));

        if (detailOnly) {
          return `
          <div class="detail-card">
            <h3>基础信息</h3>
            <div class="info-list">
              <div class="info-item"><span>机器人类型</span>${robotTypePill(record.typeLabel)}</div>
              <div class="info-item"><span>关联机器人</span>${record.relatedRobotNames.join(" / ")}</div>
              <div class="info-item"><span>模式名称</span>${record.modeName}</div>
              <div class="info-item"><span>模式说明</span>${record.description}</div>
              <div class="info-item"><span>启用状态</span>${record.status === "启用" ? pill("启用", "green") : pill("停用", "red")}</div>
              <div class="info-item"><span>最近更新时间</span>${record.updatedAt}</div>
            </div>
          </div>
